name: Supabase keepalive
# Mantem o projeto Supabase (free tier) ativo, evitando a pausa automatica
# por inatividade (~7 dias) que pode derrubar login/prancheta.
on:
  schedule:
    - cron: '17 12 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" \
            "https://ndgbwaoeuqtscdzfaucm.supabase.co/rest/v1/peladeiros?select=id&limit=1" \
            -H "apikey: sb_publishable_luSz6f-8XZ24TkUeN16NCg_rl2XkDfw" \
            -H "Authorization: Bearer sb_publishable_luSz6f-8XZ24TkUeN16NCg_rl2XkDfw")
          echo "HTTP $code"
          test "$code" = "200"
