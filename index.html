<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PSOT — Pelada de Sábado Oito e Trinta</title>
<meta name="description" content="Estatísticas, classificação, artilharia e histórico de rodadas da pelada de sábado do Clube Álvares Cabral, Vitória/ES. Desde 1981.">
<meta name="theme-color" content="#0a1424">
<meta property="og:title" content="PSOT — Pelada de Sábado Oito e Trinta">
<meta property="og:description" content="Classificação, artilharia e resultados rodada a rodada. Futebol & Churrasco desde 1981.">
<meta property="og:url" content="https://psot.site">
<meta property="og:image" content="https://psot.site/logo.png">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ── Reset & Tokens ───────────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg0:#060d18; --bg1:#0a1626; --bg2:#0d1f38;
  --navy:#0e1d34; --navy2:#13294a;
  --royal:#2f6bd6; --royal-vivid:#1a6cf5; --blue-soft:#8fbcff;
  --gold:#f4b62c; --gold-soft:#ffd56b; --gold-dim:rgba(244,182,44,.16);
  --ink:#06101f; --white:#ffffff;
  --green:#34d39a; --red:#fb7185; --amber:#fbbf24;
  --glass:rgba(255,255,255,.055);
  --glass-2:rgba(255,255,255,.09);
  --glass-3:rgba(255,255,255,.14);
  --bd:rgba(255,255,255,.10);
  --bd-2:rgba(255,255,255,.16);
  --txt:rgba(255,255,255,.94);
  --txt-2:rgba(255,255,255,.60);
  --txt-3:rgba(255,255,255,.34);
  --r:14px; --r-lg:20px; --r-xl:26px; --pill:50px;
  --sh:0 10px 34px rgba(0,0,0,.4);
  --sh-lg:0 24px 60px rgba(0,0,0,.5);
  --ff:'Inter',-apple-system,'Segoe UI',system-ui,sans-serif;
  --fd:'Sora','Inter',system-ui,sans-serif;
  --maxw:1120px;
}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--ff); color:var(--txt); line-height:1.5; min-height:100vh; overflow-x:hidden;
  background:
    radial-gradient(1100px 700px at 78% -8%, rgba(47,107,214,.22), transparent 60%),
    radial-gradient(900px 600px at 12% 6%, rgba(244,182,44,.10), transparent 55%),
    radial-gradient(800px 800px at 50% 120%, rgba(26,108,245,.14), transparent 60%),
    linear-gradient(170deg,#070f1d 0%, #0a1729 48%, #070e1c 100%);
  background-attachment:fixed;
}
/* subtle pitch lines */
body::before{
  content:''; position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.5;
  background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
  background-size:46px 46px; mask-image:radial-gradient(circle at 50% 30%,#000,transparent 85%);
}
a{color:var(--gold);text-decoration:none}
button{cursor:pointer;border:none;font-family:inherit;color:inherit}
img{max-width:100%;display:block}
::selection{background:rgba(244,182,44,.3)}
.num{font-family:var(--fd);font-variant-numeric:tabular-nums;letter-spacing:-.5px}

/* ── App shell ────────────────────────────────────────────────────── */
#app{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column}

/* ── Top bar ──────────────────────────────────────────────────────── */
#topbar{
  position:sticky;top:0;z-index:200; display:flex;align-items:center;gap:.75rem;
  padding:.7rem clamp(.8rem,3vw,1.4rem);
  background:linear-gradient(180deg,rgba(7,14,26,.92),rgba(7,14,26,.66));
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--bd);
}
.brand{display:flex;align-items:center;gap:.65rem;min-width:0}
.brand img{height:42px;width:42px;object-fit:contain;filter:drop-shadow(0 4px 10px rgba(0,0,0,.5))}
.brand .bt{display:flex;flex-direction:column;line-height:1;min-width:0}
.brand .bt b{font-family:var(--fd);font-weight:800;font-size:1.15rem;letter-spacing:.5px;color:#fff}
.brand .bt span{font-size:.62rem;letter-spacing:.6px;color:var(--txt-2);margin-top:3px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .bt b i{color:var(--gold);font-style:normal}

/* desktop nav */
#nav{display:flex;align-items:center;gap:2px;margin-left:auto;
  background:var(--glass);border:1px solid var(--bd);border-radius:var(--pill);padding:5px}
.nav-btn{background:transparent;color:var(--txt-2);padding:.5rem .95rem;border-radius:40px;font-size:.82rem;font-weight:600;transition:.18s;white-space:nowrap}
.nav-btn:hover{color:#fff;background:var(--glass-2)}
.nav-btn.active{color:#06101f;background:linear-gradient(180deg,var(--gold-soft),var(--gold));box-shadow:0 4px 14px rgba(244,182,44,.34);font-weight:700}

/* season pill */
#season{margin-left:.4rem;position:relative}
.season-btn{display:flex;align-items:center;gap:7px;background:var(--glass);border:1px solid var(--bd-2);color:#fff;
  padding:.5rem .8rem;border-radius:var(--pill);font-size:.8rem;font-weight:700;letter-spacing:.4px;transition:.18s}
.season-btn:hover{background:var(--glass-2)}
.season-btn svg{transition:transform .25s}
.season-btn.open svg{transform:rotate(180deg)}
.season-menu{position:absolute;right:0;top:calc(100% + 8px);min-width:150px;background:rgba(10,20,38,.97);
  border:1px solid var(--bd-2);border-radius:var(--r);box-shadow:var(--sh-lg);overflow:hidden;display:none}
.season-menu.open{display:block;animation:pop .16s ease}
.season-opt{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:.7rem .9rem;font-size:.85rem;font-weight:600;color:var(--txt-2);background:transparent;transition:.14s}
.season-opt:hover{background:var(--glass);color:#fff}
.season-opt.active{color:var(--gold)}
.season-opt .dot{width:7px;height:7px;border-radius:50%;background:var(--txt-3)}
.season-opt.active .dot{background:var(--gold);box-shadow:0 0 8px var(--gold)}
.season-opt .cur{margin-left:auto;font-size:.6rem;color:var(--txt-3);font-weight:600;text-transform:uppercase}

/* ── Main ─────────────────────────────────────────────────────────── */
main{flex:1;max-width:var(--maxw);margin:0 auto;width:100%;padding:1.4rem clamp(.8rem,3vw,1.4rem) 7rem}
.view{animation:fadeUp .4s cubic-bezier(.2,.7,.3,1)}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

/* section heads */
.sec-head{display:flex;align-items:center;gap:.6rem;margin:.2rem 0 1.1rem}
.sec-head .ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--gold-dim);color:var(--gold);flex-shrink:0}
.sec-head h2{font-family:var(--fd);font-size:1.32rem;font-weight:800;letter-spacing:-.4px;color:#fff}
.sec-head small{display:block;font-size:.76rem;font-weight:500;color:var(--txt-2);font-family:var(--ff);letter-spacing:0}
.sec-head .grow{margin-left:auto}

/* ── Hero (home) ──────────────────────────────────────────────────── */
.hero{position:relative;border-radius:var(--r-xl);overflow:hidden;margin-bottom:1.1rem;
  background:linear-gradient(135deg,rgba(20,41,74,.9),rgba(13,31,56,.66) 55%,rgba(10,22,40,.5));
  border:1px solid var(--bd-2);box-shadow:var(--sh);padding:1.5rem 1.4rem}
.hero::after{content:'';position:absolute;right:-60px;top:-50px;width:280px;height:280px;
  background:radial-gradient(circle,rgba(47,107,214,.35),transparent 65%);pointer-events:none}
.hero-row{display:flex;align-items:center;gap:1.1rem;position:relative;z-index:1}
.hero-logo{width:96px;height:96px;object-fit:contain;flex-shrink:0;filter:drop-shadow(0 10px 22px rgba(0,0,0,.55));animation:floaty 6s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.hero-txt h1{font-family:var(--fd);font-size:clamp(1.5rem,6vw,2.1rem);font-weight:800;line-height:1.02;color:#fff;letter-spacing:-.5px}
.hero-txt .tag{display:inline-flex;align-items:center;gap:.4rem;margin-top:.5rem;font-size:.72rem;font-weight:700;
  color:var(--gold);background:var(--gold-dim);border:1px solid rgba(244,182,44,.3);padding:.28rem .7rem;border-radius:var(--pill);letter-spacing:.5px;text-transform:uppercase}
.hero-txt .loc{font-size:.78rem;color:var(--txt-2);margin-top:.55rem}
.hero-season{position:absolute;top:1.1rem;right:1.2rem;z-index:2;font-family:var(--fd);font-weight:800;
  font-size:.82rem;color:#06101f;background:linear-gradient(180deg,var(--gold-soft),var(--gold));
  padding:.32rem .8rem;border-radius:var(--pill);box-shadow:0 4px 14px rgba(244,182,44,.4)}

/* ── Stat bento ───────────────────────────────────────────────────── */
.bento{display:grid;grid-template-columns:repeat(4,1fr);gap:.7rem;margin-bottom:1.1rem}
.stat{position:relative;background:var(--glass);border:1px solid var(--bd);border-radius:var(--r-lg);
  padding:1rem .8rem;text-align:center;overflow:hidden;transition:transform .2s,background .2s,border-color .2s}
.stat:hover{transform:translateY(-3px);background:var(--glass-2);border-color:var(--bd-2)}
.stat .v{font-family:var(--fd);font-size:1.9rem;font-weight:800;line-height:1;color:#fff;letter-spacing:-1px}
.stat .l{font-size:.62rem;color:var(--txt-2);margin-top:.4rem;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.stat .ic{position:absolute;right:-6px;bottom:-8px;font-size:2.6rem;opacity:.07;line-height:1}
.stat.gold .v{color:var(--gold)}.stat.green .v{color:var(--green)}.stat.blue .v{color:var(--blue-soft)}.stat.white .v{color:#fff}
.stat.wide{grid-column:span 2}

/* ── Cards ────────────────────────────────────────────────────────── */
.card{background:var(--glass);border:1px solid var(--bd);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--sh)}
.card-h{display:flex;align-items:center;gap:.5rem;padding:.85rem 1.15rem;font-weight:700;font-size:.86rem;letter-spacing:.2px;border-bottom:1px solid var(--bd)}
.card-h .ic{opacity:.9}
.card-h.gold{background:linear-gradient(90deg,rgba(244,182,44,.14),transparent);color:var(--gold-soft)}
.card-h.blue{background:linear-gradient(90deg,rgba(47,107,214,.18),transparent);color:var(--blue-soft)}
.card-h.green{background:linear-gradient(90deg,rgba(52,211,154,.14),transparent);color:var(--green)}
.card-h.dark{background:rgba(255,255,255,.03)}
.card-h .more{margin-left:auto;font-size:.74rem;font-weight:600;color:var(--txt-2)}
.card-b{padding:1.15rem}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:.9rem}
.cols-home{display:grid;grid-template-columns:1.05fr .95fr;gap:.9rem;margin-bottom:.9rem}

/* ── Scoreboard ───────────────────────────────────────────────────── */
.scoreboard{display:flex;align-items:stretch;border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--bd)}
.sb-side{flex:1;padding:1.15rem .8rem;text-align:center;position:relative}
.sb-side.preto{background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02))}
.sb-side.azul{background:linear-gradient(180deg,rgba(47,107,214,.22),rgba(47,107,214,.06))}
.sb-side .tn{font-size:.64rem;font-weight:800;letter-spacing:1.5px;text-transform:uppercase}
.sb-side.preto .tn{color:var(--txt-2)}.sb-side.azul .tn{color:var(--blue-soft)}
.sb-side .sc{font-family:var(--fd);font-size:3.1rem;font-weight:800;line-height:1;margin-top:.25rem;color:#fff}
.sb-side .sc.win{color:var(--gold);text-shadow:0 4px 22px rgba(244,182,44,.35)}
.sb-side .crown{position:absolute;top:.5rem;left:50%;transform:translateX(-50%);font-size:.9rem;opacity:.95}
.sb-mid{display:grid;place-items:center;padding:0 .2rem;background:rgba(0,0,0,.18)}
.sb-mid span{font-family:var(--fd);font-size:1rem;color:var(--txt-3);font-weight:700}
.res-badge{display:inline-block;margin:.85rem auto 0;padding:.34rem 1rem;border-radius:var(--pill);font-size:.74rem;font-weight:700;letter-spacing:.4px}
.res-badge.azul{background:rgba(47,107,214,.2);color:var(--blue-soft);border:1px solid rgba(47,107,214,.32)}
.res-badge.preto{background:var(--glass-2);color:#fff;border:1px solid var(--bd-2)}
.res-badge.empate{background:rgba(251,191,36,.16);color:var(--amber);border:1px solid rgba(251,191,36,.3)}

/* chips / tags */
.chips{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.55rem;justify-content:center}
.chip{background:rgba(52,211,154,.12);color:var(--green);padding:.24rem .6rem;border-radius:var(--pill);font-size:.74rem;font-weight:600;border:1px solid rgba(52,211,154,.2)}
.chip .g{opacity:.7;font-weight:700}

/* ── Ranked list (artilharia / leaders) ───────────────────────────── */
.rank-row{display:flex;align-items:center;gap:.7rem;padding:.62rem .3rem;border-bottom:1px solid rgba(255,255,255,.05);transition:background .15s;border-radius:10px}
.rank-row:last-child{border-bottom:none}
.rank-row.clk{cursor:pointer}.rank-row.clk:hover{background:var(--glass)}
.rk{width:30px;text-align:center;font-family:var(--fd);font-weight:700;font-size:.9rem;color:var(--txt-2);flex-shrink:0}
.rk.top{font-size:1.05rem}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--fd);font-weight:800;font-size:.85rem;flex-shrink:0;
  color:#06101f;background:linear-gradient(135deg,var(--gold-soft),var(--gold));box-shadow:0 3px 10px rgba(244,182,44,.3)}
.av.b{background:linear-gradient(135deg,#7fb4ff,var(--royal));color:#06101f;box-shadow:0 3px 10px rgba(47,107,214,.3)}
.rn{flex:1;font-weight:600;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{flex:1;max-width:120px;height:7px;background:rgba(255,255,255,.07);border-radius:5px;overflow:hidden;min-width:40px}
.bar > i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--green),#6ee7c0);width:0;transition:width .7s cubic-bezier(.2,.7,.3,1)}
.bar > i.gc{background:var(--txt-3)}
.rv{font-family:var(--fd);font-weight:800;color:var(--green);min-width:30px;text-align:right;font-size:1rem}
.rv.muted{color:var(--txt-3)}

/* ── Tables ───────────────────────────────────────────────────────── */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:.875rem}
thead th{padding:.7rem .7rem;text-align:center;font-size:.66rem;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--txt-2);border-bottom:1px solid var(--bd);white-space:nowrap;position:sticky;top:0}
thead th:nth-child(2){text-align:left}
tbody tr{border-bottom:1px solid rgba(255,255,255,.045);transition:background .14s}
tbody tr:last-child{border-bottom:none}
tbody tr.clk{cursor:pointer}tbody tr.clk:hover{background:var(--glass)}
tbody tr.gold{background:linear-gradient(90deg,rgba(244,182,44,.12),rgba(244,182,44,.02))}
tbody tr.silver{background:rgba(255,255,255,.045)}
tbody tr.bronze{background:linear-gradient(90deg,rgba(255,138,76,.09),transparent)}
tbody td{padding:.6rem .7rem;text-align:center;color:var(--txt);white-space:nowrap}
tbody td:nth-child(2){text-align:left;font-weight:600}
.pts{font-family:var(--fd);font-weight:800;color:var(--gold)}
.gv{font-family:var(--fd);font-weight:700;color:var(--green)}
.cell-name{display:flex;align-items:center;gap:.55rem}
.cell-name .mini{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-family:var(--fd);font-weight:800;font-size:.7rem;color:#06101f;background:linear-gradient(135deg,var(--gold-soft),var(--gold));flex-shrink:0}
.b-v{background:rgba(52,211,154,.15);color:var(--green);padding:.16rem .5rem;border-radius:6px;font-weight:700;font-size:.78rem}
.b-d{background:rgba(251,113,133,.15);color:var(--red);padding:.16rem .5rem;border-radius:6px;font-weight:700;font-size:.78rem}
.b-e{background:rgba(251,191,36,.15);color:var(--amber);padding:.16rem .5rem;border-radius:6px;font-weight:700;font-size:.78rem}
.cart{display:inline-flex;align-items:center;justify-content:center;background:rgba(251,191,36,.14);color:var(--amber);border-radius:6px;padding:.1rem .4rem;font-size:.76rem;font-weight:800;cursor:help;position:relative}
.cart::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:rgba(12,18,32,.97);color:#fff;border:1px solid var(--bd-2);border-radius:7px;padding:.34rem .65rem;white-space:nowrap;font-size:.72rem;font-weight:500;opacity:0;pointer-events:none;transition:.16s;z-index:9}
.cart:hover::after{opacity:1}

/* form dots (W/D/L) */
.form{display:inline-flex;gap:3px}
.form i{width:9px;height:9px;border-radius:50%;display:inline-block}
.form i.v{background:var(--green)}.form i.e{background:var(--amber)}.form i.d{background:var(--red)}

/* ── Tabs (sub) ───────────────────────────────────────────────────── */
.tabs{display:flex;gap:.3rem;margin-bottom:1rem;background:var(--glass);border:1px solid var(--bd);border-radius:var(--pill);padding:4px;width:fit-content;max-width:100%;overflow-x:auto}
.tab-btn{padding:.5rem 1rem;border-radius:40px;background:transparent;font-weight:600;font-size:.82rem;color:var(--txt-2);white-space:nowrap;transition:.16s}
.tab-btn.active{background:var(--glass-3);color:#fff}
.tab-content{display:none}.tab-content.active{display:block;animation:fadeUp .3s ease}
.note{font-size:.74rem;color:var(--txt-3);margin-top:.6rem;padding-left:.2rem}
.mini-tag{background:var(--gold-dim);color:var(--gold);font-size:.66rem;padding:.1rem .4rem;border-radius:5px;margin-left:.3rem;font-weight:700}

/* ── Round cards ──────────────────────────────────────────────────── */
.rounds{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:.85rem}
.rcard{background:var(--glass);border:1px solid var(--bd);border-radius:var(--r-lg);overflow:hidden;cursor:pointer;transition:transform .2s,box-shadow .2s,border-color .2s}
.rcard:hover{transform:translateY(-4px);box-shadow:var(--sh-lg);border-color:var(--bd-2)}
.rcard-h{display:flex;justify-content:space-between;align-items:center;padding:.55rem .9rem;font-size:.74rem;font-weight:700}
.rcard-h.azul{background:linear-gradient(90deg,rgba(47,107,214,.2),transparent);color:var(--blue-soft)}
.rcard-h.preto{background:rgba(255,255,255,.05);color:var(--txt)}
.rcard-h.empate{background:linear-gradient(90deg,rgba(251,191,36,.14),transparent);color:var(--amber)}
.rcard-sb{display:flex;align-items:center;justify-content:center;gap:1.1rem;padding:.9rem .5rem .5rem}
.rcard-sb .t{text-align:center}
.rcard-sb .tl{font-size:.6rem;font-weight:800;letter-spacing:1.2px;color:var(--txt-3);text-transform:uppercase}
.rcard-sb .ts{font-family:var(--fd);font-size:2.1rem;font-weight:800;line-height:1;color:#fff}
.rcard-sb .ts.win{color:var(--gold)}
.rcard-sb .x{color:var(--txt-3);font-size:1rem}
.rcard-f{padding:.4rem .9rem .8rem;border-top:1px solid var(--bd);margin-top:.3rem}

/* round detail */
.rd-hero{position:relative;border-radius:var(--r-xl);overflow:hidden;border:1px solid var(--bd-2);padding:1.8rem 1.2rem;text-align:center;margin-bottom:1.1rem;
  background:linear-gradient(135deg,rgba(20,41,74,.85),rgba(10,22,40,.6))}
.rd-hero::before{content:'';position:absolute;inset:0;background:url('logo.png') center/150px no-repeat;opacity:.05;pointer-events:none}
.rd-date{font-size:.78rem;color:var(--txt-2);letter-spacing:.5px}
.rd-ttl{font-family:var(--fd);font-size:.8rem;font-weight:700;color:var(--gold);letter-spacing:2px;margin-top:.2rem}
.rd-sb{display:flex;align-items:center;justify-content:center;gap:1.6rem;margin-top:1rem;position:relative;z-index:1}
.rd-sb .t{text-align:center}
.rd-sb .tl{font-size:.66rem;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--txt-3)}
.rd-sb .tl.az{color:var(--blue-soft)}
.rd-sb .ts{font-family:var(--fd);font-size:clamp(3rem,16vw,4.6rem);font-weight:800;line-height:1;color:#fff}
.rd-sb .ts.win{color:var(--gold)}
.rd-sb .x{font-size:1.6rem;color:var(--txt-3)}
.lineups{display:grid;grid-template-columns:1fr 1fr;gap:.9rem;margin-bottom:1.1rem}
.lu{background:var(--glass);border:1px solid var(--bd);border-radius:var(--r-lg);overflow:hidden}
.lu-h{padding:.65rem 1rem;font-weight:700;font-size:.8rem;letter-spacing:.5px;text-transform:uppercase}
.lu-h.preto{background:rgba(255,255,255,.06);color:#fff}
.lu-h.azul{background:rgba(47,107,214,.2);color:var(--blue-soft)}
.lu ul{list-style:none;padding:.4rem 0}
.lu li{padding:.4rem 1rem;font-size:.86rem;display:flex;align-items:center;gap:.5rem;border-bottom:1px solid rgba(255,255,255,.04)}
.lu li:last-child{border-bottom:none}
.lu li .g{color:var(--green);font-size:.82rem;font-weight:700;margin-left:auto}

/* ── Player profile ───────────────────────────────────────────────── */
.p-hero{display:flex;align-items:center;gap:1.2rem;background:linear-gradient(135deg,rgba(20,41,74,.8),rgba(10,22,40,.55));
  border:1px solid var(--bd-2);border-radius:var(--r-xl);padding:1.5rem 1.4rem;margin-bottom:1.1rem;position:relative;overflow:hidden}
.p-hero::after{content:'';position:absolute;right:-40px;top:-30px;width:180px;height:180px;background:radial-gradient(circle,rgba(244,182,44,.18),transparent 65%)}
.p-av{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-family:var(--fd);font-weight:800;font-size:2.1rem;color:#06101f;
  background:linear-gradient(135deg,var(--gold-soft),var(--gold));box-shadow:0 8px 22px rgba(244,182,44,.4);flex-shrink:0;position:relative;z-index:1}
.p-info{position:relative;z-index:1;min-width:0}
.p-info h1{font-family:var(--fd);font-size:1.6rem;font-weight:800;color:#fff;line-height:1.05}
.p-info .nm{font-size:.86rem;color:var(--txt-2);margin-top:.2rem}
.p-info .mt{font-size:.78rem;color:var(--txt-3);margin-top:.4rem;display:flex;gap:.8rem;flex-wrap:wrap}
.p-info .mt b{color:var(--txt-2);font-weight:600}
.styled-tabs{display:flex;gap:.5rem;margin-bottom:1rem}
.styled-tabs button{padding:.45rem 1rem;border-radius:var(--pill);border:1px solid var(--bd);background:var(--glass);font-weight:700;font-size:.84rem;color:var(--txt-2);transition:.18s}
.styled-tabs button.active{background:var(--gold-dim);color:var(--gold);border-color:rgba(244,182,44,.4)}

/* ── Search ───────────────────────────────────────────────────────── */
.search{position:relative;margin-bottom:1.1rem}
.search input{width:100%;padding:.8rem 1.1rem .8rem 2.6rem;border:1px solid var(--bd);border-radius:var(--pill);font-size:.9rem;outline:none;
  background:var(--glass);color:#fff;transition:.2s;font-family:inherit}
.search input::placeholder{color:var(--txt-3)}
.search input:focus{border-color:rgba(244,182,44,.5);background:var(--glass-2)}
.search svg{position:absolute;left:.95rem;top:50%;transform:translateY(-50%);color:var(--txt-3)}

/* player grid cards */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:.8rem}
.pcard{background:var(--glass);border:1px solid var(--bd);border-radius:var(--r-lg);overflow:hidden;cursor:pointer;transition:transform .2s,border-color .2s,box-shadow .2s}
.pcard:hover{transform:translateY(-4px);border-color:var(--bd-2);box-shadow:var(--sh)}
.pcard-top{display:flex;align-items:center;gap:.55rem;padding:.7rem .8rem;border-bottom:1px solid var(--bd)}
.pcard-top .num{margin-left:auto;background:var(--glass-2);color:var(--txt-2);font-size:.7rem;font-weight:700;padding:.1rem .45rem;border-radius:5px}
.pcard-grid{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;padding:.8rem .4rem}
.pcard-grid .v{font-family:var(--fd);font-size:1.25rem;font-weight:800;line-height:1}
.pcard-grid .l{font-size:.56rem;color:var(--txt-3);font-weight:600;text-transform:uppercase;letter-spacing:.4px;margin-top:3px}

/* ── Back / ghost btn ─────────────────────────────────────────────── */
.back{display:inline-flex;align-items:center;gap:.4rem;color:var(--txt-2);font-weight:600;margin-bottom:1.1rem;font-size:.85rem;background:var(--glass);border:1px solid var(--bd);padding:.5rem 1rem;border-radius:var(--pill);transition:.18s}
.back:hover{background:var(--glass-2);color:#fff}
.ghost{display:inline-flex;align-items:center;gap:.35rem;background:var(--glass-2);border:1px solid var(--bd);color:var(--txt-2);padding:.5rem 1.1rem;border-radius:var(--pill);font-size:.8rem;font-weight:600;transition:.18s}
.ghost:hover{background:var(--glass-3);color:#fff}
.center{text-align:center;margin-top:.9rem}

/* ── Loading ──────────────────────────────────────────────────────── */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh}
.loading .ball{font-size:3rem;animation:bounce .7s cubic-bezier(.36,.07,.19,.97) infinite;filter:drop-shadow(0 12px 8px rgba(0,0,0,.45))}
.loading .sh{width:34px;height:9px;background:rgba(0,0,0,.3);border-radius:50%;margin-top:5px;animation:shp .7s cubic-bezier(.36,.07,.19,.97) infinite}
.loading .tx{color:var(--txt-2);font-size:.86rem;font-weight:600;margin-top:1.3rem;letter-spacing:.3px}
@keyframes bounce{0%{transform:translateY(0) scaleX(1) scaleY(1)}40%{transform:translateY(-48px)}50%{transform:translateY(-48px) scaleX(1.06) scaleY(.94)}60%{transform:translateY(-48px)}92%{transform:translateY(0) scaleX(1.1) scaleY(.9)}100%{transform:translateY(0)}}
@keyframes shp{0%,100%{transform:scale(1);opacity:.35}50%{transform:scale(.45);opacity:.1}}

/* empty */
.empty{text-align:center;padding:3.5rem 1rem;color:var(--txt-2)}
.empty .e{font-size:3rem;margin-bottom:.7rem}
.recon{background:var(--gold-dim);color:var(--gold);font-size:.64rem;padding:.1rem .42rem;border-radius:5px;font-weight:700}

/* gallery */
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.8rem;margin-top:1rem}
.gslot{aspect-ratio:1;background:var(--glass);border:1px dashed var(--bd-2);border-radius:var(--r);display:grid;place-items:center;color:var(--txt-3);font-size:1.6rem;transition:.2s}
.gslot:hover{background:var(--glass-2)}
.aviso{background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.35);color:var(--amber);border-radius:12px;padding:.75rem 1.1rem;margin-bottom:1rem;font-size:.86rem;font-weight:700;text-align:center}

/* ── Bottom nav (mobile) ──────────────────────────────────────────── */
#botnav{display:none}
footer{text-align:center;padding:1.4rem 1rem;font-size:.78rem;color:var(--txt-3);border-top:1px solid var(--bd);display:flex;flex-direction:column;gap:.3rem;align-items:center}
footer img{height:30px;opacity:.85}
footer .upd{font-size:.72rem}

/* ── Responsive ───────────────────────────────────────────────────── */
@media(max-width:860px){
  .cols-home{grid-template-columns:1fr}
}
@media(max-width:680px){
  #nav{display:none}
  .bento{grid-template-columns:repeat(2,1fr)}
  .grid-2,.lineups{grid-template-columns:1fr}
  .rounds{grid-template-columns:1fr 1fr}
  .brand .bt span{display:none}
  .hero-season{display:none}
  main{padding-bottom:6rem}
  /* bottom app nav */
  #botnav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:300;
    background:linear-gradient(0deg,rgba(7,13,24,.98),rgba(7,13,24,.86));
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border-top:1px solid var(--bd);padding:.4rem .2rem calc(.4rem + env(safe-area-inset-bottom));justify-content:space-around}
  .bn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:transparent;color:var(--txt-3);padding:.35rem .1rem;font-size:.58rem;font-weight:700;letter-spacing:.2px;transition:.15s;border-radius:12px}
  .bn svg{width:21px;height:21px}
  .bn.active{color:var(--gold)}
  .bn.active svg{filter:drop-shadow(0 0 6px rgba(244,182,44,.5))}
}
@media(max-width:420px){
  .rounds{grid-template-columns:1fr}
  .pgrid{grid-template-columns:1fr 1fr}
  .hero-logo{width:74px;height:74px}
}
</style>
</head>
<body>
<div id="app">

  <!-- Top bar -->
  <header id="topbar">
    <div class="brand">
      <img src="logo.png" alt="PSOT" onclick="navigate('home')" style="cursor:pointer">
      <div class="bt">
        <b>PS<i>O</i>T</b>
        <span>Pelada de Sábado Oito e Trinta</span>
      </div>
    </div>
    <nav id="nav">
      <button class="nav-btn active" data-page="home" onclick="navigate('home')">Início</button>
      <button class="nav-btn" data-page="classificacao" onclick="navigate('classificacao')">Classificação</button>
      <button class="nav-btn" data-page="artilharia" onclick="navigate('artilharia')">Artilharia</button>
      <button class="nav-btn" data-page="rodadas" onclick="navigate('rodadas')">Rodadas</button>
      <button class="nav-btn" data-page="jogadores" onclick="navigate('jogadores')">Jogadores</button>
      <button class="nav-btn" data-page="galeria" onclick="navigate('galeria')">Galeria</button>
    </nav>
    <div id="season">
      <button class="season-btn" id="season-btn" onclick="toggleSeason()">
        <span id="season-lbl">2026</span>
        <svg width="10" height="6" viewBox="0 0 10 6" fill="none"><path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="season-menu" id="season-menu"></div>
    </div>
  </header>

  <main id="view">
    <div class="loading"><div class="ball">⚽</div><div class="sh"></div><div class="tx">Carregando a pelada...</div></div>
  </main>

  <footer>
    <img src="logo.png" alt="PSOT">
    <div><strong style="color:var(--txt-2)">PSOT</strong> · Clube Álvares Cabral, Vitória/ES · <span style="color:var(--gold)">Futebol &amp; Churrasco desde 1981</span></div>
    <div class="upd" id="footer-upd"></div>
  </footer>

  <!-- Bottom nav (mobile) -->
  <nav id="botnav">
    <button class="bn active" data-page="home" onclick="navigate('home')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>Início</button>
    <button class="bn" data-page="classificacao" onclick="navigate('classificacao')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 21V9m6 12V4m6 17v-7"/></svg>Tabela</button>
    <button class="bn" data-page="artilharia" onclick="navigate('artilharia')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Gols</button>
    <button class="bn" data-page="rodadas" onclick="navigate('rodadas')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4m8-4v4"/></svg>Rodadas</button>
    <button class="bn" data-page="jogadores" onclick="navigate('jogadores')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 20a5.5 5.5 0 0 1 11 0M16 5.2a3 3 0 0 1 0 5.6M19.5 20a5 5 0 0 0-3-4.6"/></svg>Elenco</button>
    <button class="bn" data-page="galeria" onclick="navigate('galeria')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.6"/><path d="m21 16-5-5L5 20"/></svg>Galeria</button>
  </nav>
</div>

<script>
// ── Icons ─────────────────────────────────────────────────────────
const I={
  home:'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5M5 9.5V21h14V9.5"/></svg>',
  trophy:'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h10v4a5 5 0 0 1-10 0V4ZM7 6H4v1a3 3 0 0 0 3 3M17 6h3v1a3 3 0 0 1-3 3M9 18h6M10 18v-3m4 3v-3M8 21h8"/></svg>',
  ball:'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7l4.5 3.3-1.7 5.4H9.2L7.5 10.3 12 7Z"/></svg>',
  cal:'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4m8-4v4"/></svg>',
  users:'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 20a5.5 5.5 0 0 1 11 0M16 5.2a3 3 0 0 1 0 5.6M19.5 20a5 5 0 0 0-3-4.6"/></svg>',
  cam:'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.6"/><path d="m21 16-5-5L5 20"/></svg>',
  fire:'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3s4 3.5 4 8a4 4 0 0 1-8 0c0-1 .3-2 .8-2.7C9 11 12 9 12 3Z"/><path d="M9.5 14.5A2.5 2.5 0 0 0 12 19a2.5 2.5 0 0 0 2.5-3"/></svg>',
  search:'<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>',
  star:'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9 6.8 19.2l1-5.8L3.5 9.2l5.9-.9L12 3Z"/></svg>'
};

// ── State ─────────────────────────────────────────────────────────
const state={page:'home',season:'2026',seasons:{},config:null,ddOpen:false};

// ── Season dropdown ───────────────────────────────────────────────
function toggleSeason(){state.ddOpen=!state.ddOpen;document.getElementById('season-menu').classList.toggle('open',state.ddOpen);document.getElementById('season-btn').classList.toggle('open',state.ddOpen);}
function closeSeason(){state.ddOpen=false;document.getElementById('season-menu').classList.remove('open');document.getElementById('season-btn').classList.remove('open');}
document.addEventListener('click',e=>{const w=document.getElementById('season');if(w&&!w.contains(e.target))closeSeason();});
function buildSeason(){
  document.getElementById('season-lbl').textContent=state.season;
  document.getElementById('season-menu').innerHTML=state.config.seasons.map(s=>`
    <button class="season-opt ${s===state.season?'active':''}" onclick="setSeason('${s}')"><span class="dot"></span>${s}${s===state.config.current_season?'<span class="cur">atual</span>':''}</button>`).join('');
}
function setSeason(s){state.season=s;closeSeason();buildSeason();navigate(state.page);}
function S(){return state.seasons[state.season];}

// ── Load ──────────────────────────────────────────────────────────
async function loadData(){
  const [cfg,s25,s26]=await Promise.all([
    fetch('data/config.json').then(r=>r.json()),
    fetch('data/2025.json').then(r=>r.json()),
    fetch('data/2026.json').then(r=>r.json())
  ]);
  state.config=cfg;state.seasons['2025']=s25;state.seasons['2026']=s26;state.season=cfg.current_season;
  document.getElementById('footer-upd').textContent='Atualizado em '+cfg.updated;
  buildSeason();navigate('home');
}

// ── Router ────────────────────────────────────────────────────────
function navigate(page,params={}){
  state.page=page.split(':')[0];
  document.querySelectorAll('#nav .nav-btn,#botnav .bn').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page));
  const el=document.getElementById('view');
  const R={home:renderHome,classificacao:renderClassificacao,artilharia:renderArtilharia,rodadas:renderRodadas,
    rodada:()=>renderRodadaDetail(params.num),jogadores:renderJogadores,
    jogador:()=>renderJogadorDetail(params.apelido,params.season),galeria:renderGaleria};
  el.innerHTML=`<div class="view">${(R[state.page]||renderHome)()}</div>`;
  window.scrollTo(0,0);
  requestAnimationFrame(()=>document.querySelectorAll('.bar>i[data-w]').forEach(b=>b.style.width=b.dataset.w+'%'));
}

// ── Helpers ───────────────────────────────────────────────────────
const MES=['','Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
function fmtDate(d){if(!d)return'';const[a,m,y]=d.split('.');return `${+a} ${MES[+m]} ${y}`;}
function fmtShort(d){if(!d)return'';const[a,m]=d.split('.');return `${a}/${m}`;}
function pts(p){return (p.vitorias||0)*3+(p.empates||0);}
function pct(v,j){return j>0?Math.round(v/j*100)+'%':'—';}
function medal(p){return p===1?'🥇':p===2?'🥈':p===3?'🥉':p;}
function rowCls(p){return p===1?'gold':p===2?'silver':p===3?'bronze':'';}
function initial(ap){return (ap||'?').charAt(0).toUpperCase();}
function escAp(a){return encodeURIComponent(a);}
function decAp(a){return decodeURIComponent(a);}
function venc(pf,v){v=v||(pf?(pf[0]>pf[1]?'PRETO':pf[1]>pf[0]?'AZUL':'EMPATE'):'EMPATE');return v;}
function scorers(g){if(!g)return[];return Object.entries(g).filter(([,x])=>x>0).sort(([,a],[,b])=>b-a);}
function allPlayers(){
  const seen={};['2025','2026'].forEach(yr=>{const s=state.seasons[yr];if(!s)return;
    s.players.forEach(p=>{const k=p.apelido.toUpperCase();if(!seen[k])seen[k]={apelido:p.apelido,nome:p.nome,seasons:{}};seen[k].seasons[yr]=p;});});
  return Object.values(seen);
}
function playerForm(ap){ // last 5 results for a player this season
  const s=S();const A=ap.toUpperCase();const out=[];
  s.rounds.forEach(r=>{
    const inP=(r.time_preto||[]).map(x=>x.toUpperCase()).some(x=>x===A||x.includes(A)||A.includes(x));
    const inA=(r.time_azul||[]).map(x=>x.toUpperCase()).some(x=>x===A||x.includes(A)||A.includes(x));
    if(!inP&&!inA)return;const pf=r.placar_final;
    const team=inP?0:1;const me=pf[team],ot=pf[1-team];
    out.push(me>ot?'v':me<ot?'d':'e');
  });
  return out.slice(-5);
}

// ── HOME ──────────────────────────────────────────────────────────
function renderHome(){
  const s=S(),st=s.stats;
  const last=s.rounds[s.rounds.length-1];
  const top3=s.artilharia.slice(0,3);
  const top5=[...s.players].filter(p=>p.jogos>0).sort((a,b)=>pts(b)-pts(a)||b.gols-a.gols).slice(0,5);
  const leader=top5[0];
  const aviso=state.config?.proximo_aviso_ativo&&state.config?.proximo_aviso?`<div class="aviso">📢 ${state.config.proximo_aviso}</div>`:'';
  const v=last?venc(last.placar_final,last.vencedor):null;

  return `${aviso}
  <div class="hero">
    <div class="hero-season">⭐ ${state.season}</div>
    <div class="hero-row">
      <img class="hero-logo" src="logo.png" alt="PSOT">
      <div class="hero-txt">
        <h1>Pelada de Sábado<br>Oito e Trinta</h1>
        <div class="tag">${I.star} Futebol &amp; Churrasco · Desde 1981</div>
        <div class="loc">📍 Clube Álvares Cabral — Vitória/ES · Sábados 8h30</div>
      </div>
    </div>
  </div>

  <div class="bento">
    <div class="stat"><div class="v num">${s.total_rodadas}</div><div class="l">Rodadas</div><div class="ic">📅</div></div>
    <div class="stat green"><div class="v num">${st.total_gols}</div><div class="l">Gols</div><div class="ic">⚽</div></div>
    <div class="stat gold"><div class="v num">${st.media_gols}</div><div class="l">Média/Jogo</div><div class="ic">📈</div></div>
    <div class="stat blue"><div class="v num">${s.players.filter(p=>p.jogos>0).length}</div><div class="l">Peladeiros</div><div class="ic">👥</div></div>
    <div class="stat white"><div class="v num">${st.vitoria_preto}</div><div class="l">Vitórias Preto</div></div>
    <div class="stat blue"><div class="v num">${st.vitoria_azul}</div><div class="l">Vitórias Azul</div></div>
    <div class="stat gold"><div class="v num">${st.empates}</div><div class="l">Empates</div></div>
    <div class="stat"><div class="v num">${leader?leader.apelido:'—'}</div><div class="l">Líder 🏆</div></div>
  </div>

  <div class="cols-home">
    <!-- Última rodada -->
    <div class="card">
      <div class="card-h dark">${I.cal}Última Rodada · R${last?.rodada||'—'}<span class="more">${last?fmtDate(last.data):''}</span></div>
      <div class="card-b">
        ${last?`
        <div class="scoreboard">
          <div class="sb-side preto">${v==='PRETO'?'<div class="crown">👑</div>':''}<div class="tn">Preto</div><div class="sc ${v==='PRETO'?'win':''}">${last.placar_final[0]}</div></div>
          <div class="sb-mid"><span>×</span></div>
          <div class="sb-side azul">${v==='AZUL'?'<div class="crown">👑</div>':''}<div class="tn">Azul</div><div class="sc ${v==='AZUL'?'win':''}">${last.placar_final[1]}</div></div>
        </div>
        <div style="text-align:center"><span class="res-badge ${v.toLowerCase()}">${v==='EMPATE'?'Empate':'Vitória Time '+(v==='AZUL'?'Azul':'Preto')}</span></div>
        ${scorers(last.gols).length?`<div class="chips">${scorers(last.gols).map(([n,g])=>`<span class="chip">${n}${g>1?` <span class="g">×${g}</span>`:''}</span>`).join('')}</div>`:''}
        <div class="center">${ghost('Ver detalhes',`navigate('rodada',{num:${last.rodada}})`)}</div>
        `:'<div class="empty"><div class="e">📅</div>Sem rodadas ainda</div>'}
      </div>
    </div>

    <!-- Artilheiros -->
    <div class="card">
      <div class="card-h green">${I.fire}Artilheiros<span class="more">Top 3</span></div>
      <div class="card-b" style="padding-top:.6rem">
        ${top3.map((a,i)=>`
        <div class="rank-row clk" onclick="navigate('jogador',{apelido:'${escAp(a.apelido)}',season:'${state.season}'})">
          <div class="rk top">${medal(i+1)}</div>
          <div class="av">${initial(a.apelido)}</div>
          <div class="rn">${a.apelido}</div>
          <div class="bar"><i data-w="${Math.round(a.gols/top3[0].gols*100)}"></i></div>
          <div class="rv">${a.gols}</div>
        </div>`).join('')}
        <div class="center">${ghost('Tabela de artilharia',"navigate('artilharia')")}</div>
      </div>
    </div>
  </div>

  <!-- Top 5 classificação -->
  <div class="card">
    <div class="card-h blue">${I.trophy}Classificação · Top 5<span class="more">Temporada ${state.season}</span></div>
    <div class="tw">
      <table>
        <thead><tr><th>#</th><th>Jogador</th><th>J</th><th>V</th><th>E</th><th>D</th><th>PTS</th><th>Gols</th></tr></thead>
        <tbody>${top5.map((p,i)=>`
          <tr class="clk ${rowCls(i+1)}" onclick="navigate('jogador',{apelido:'${escAp(p.apelido)}',season:'${state.season}'})">
            <td class="num">${medal(i+1)}</td>
            <td><div class="cell-name"><span class="mini">${initial(p.apelido)}</span>${p.apelido}</div></td>
            <td>${p.jogos}</td><td><span class="b-v">${p.vitorias}</span></td><td>${p.empates||0}</td><td>${p.derrotas||0}</td>
            <td class="pts">${pts(p)}</td><td class="gv">${p.gols}</td>
          </tr>`).join('')}</tbody>
      </table>
    </div>
    <div class="center" style="padding:.85rem">${ghost('Classificação completa',"navigate('classificacao')")}</div>
  </div>`;
}

function ghost(label,onclick){return `<button class="ghost" onclick="${onclick}">${label} →</button>`;}

// ── CLASSIFICAÇÃO ─────────────────────────────────────────────────
function renderClassificacao(){
  const s=S();const tot=s.total_rodadas;const minJ=Math.floor(tot/2);
  const ativos=[...s.players].filter(p=>p.jogos>0).sort((a,b)=>pts(b)-pts(a)||b.gols-a.gols||a.apelido.localeCompare(b.apelido));
  const eleg=ativos.filter(p=>p.jogos>=minJ);const inel=ativos.filter(p=>p.jogos<minJ);
  const cart=p=>{const c=p.cartoes||{CA:0,CAz:0,CV:0};const t=(c.CA||0)+(c.CAz||0)+(c.CV||0);
    return t?`<td><span class="cart" data-tip="🟨 ${c.CA||0}  🟦 ${c.CAz||0}  🟥 ${c.CV||0}">${t}</span></td>`:'<td style="color:var(--txt-3)">—</td>';};
  const rows=(list,showPos=true)=>list.map((p,i)=>{const pos=i+1;
    return `<tr class="clk ${showPos?rowCls(pos):''}" onclick="navigate('jogador',{apelido:'${escAp(p.apelido)}',season:'${state.season}'})">
      <td class="num">${showPos?medal(pos):'—'}</td>
      <td><div class="cell-name"><span class="mini">${initial(p.apelido)}</span>${p.apelido}</div></td>
      <td>${p.jogos}/${tot}</td><td><span class="b-v">${p.vitorias}</span></td><td>${p.empates||0}</td><td>${p.derrotas||0}</td>
      <td class="pts">${pts(p)}</td><td class="gv">${p.gols}</td>${cart(p)}<td style="color:var(--txt-2)">${pct(p.vitorias,p.jogos)}</td></tr>`;}).join('');
  const pctRows=[...eleg].sort((a,b)=>(b.vitorias/b.jogos-a.vitorias/a.jogos)||pts(b)-pts(a)||b.gols-a.gols);
  return `
  <div class="sec-head"><div class="ic">${I.trophy}</div><div><h2>Classificação</h2><small>Temporada ${state.season} · ${ativos.length} jogadores</small></div></div>
  <div class="tabs">
    <button class="tab-btn active" onclick="tab('t-geral',this)">Geral</button>
    <button class="tab-btn" onclick="tab('t-pct',this)">% Vitórias<span class="mini-tag">mín ${minJ}j</span></button>
  </div>
  <div id="t-geral" class="tab-content active">
    <div class="card"><div class="tw"><table>
      <thead><tr><th>#</th><th>Jogador</th><th>J</th><th>V</th><th>E</th><th>D</th><th>PTS</th><th>Gols</th><th>Cart</th><th>%V</th></tr></thead>
      <tbody>${rows(ativos)}</tbody></table></div></div>
    <p class="note">PTS = Vitórias×3 + Empates×1 · toque num jogador pra ver o perfil</p>
  </div>
  <div id="t-pct" class="tab-content">
    <div class="card"><div class="tw"><table>
      <thead><tr><th>#</th><th>Jogador</th><th>J</th><th>V</th><th>E</th><th>D</th><th>PTS</th><th>Gols</th><th>Cart</th><th>%V</th></tr></thead>
      <tbody>${rows(pctRows)}</tbody></table></div></div>
    ${inel.length?`<div class="card" style="margin-top:.9rem"><div class="card-h" style="background:rgba(251,191,36,.08);color:var(--amber)">⚠️ Amostra insuficiente — menos de ${minJ} jogos</div>
      <div class="tw"><table><thead><tr><th>#</th><th>Jogador</th><th>J</th><th>V</th><th>E</th><th>D</th><th>PTS</th><th>Gols</th><th>Cart</th><th>%V</th></tr></thead>
      <tbody style="opacity:.6">${rows(inel,false)}</tbody></table></div></div>`:''}
    <p class="note">Mínimo de ${minJ} jogos (metade das ${tot} rodadas) para entrar no ranking por aproveitamento.</p>
  </div>`;
}

// ── ARTILHARIA ────────────────────────────────────────────────────
function renderArtilharia(){
  const s=S();const art=s.artilharia;const max=art[0]?.gols||1;
  return `
  <div class="sec-head"><div class="ic">${I.fire}</div><div><h2>Artilharia</h2><small>${state.season} · ${art.length} goleadores</small></div></div>
  <div class="card"><div class="card-b" style="padding-top:.5rem">
    ${art.map((a,i)=>{const gc=/GOL CONTRA|^GC$/i.test(a.apelido);
      return `<div class="rank-row ${gc?'':'clk'}" ${gc?'':`onclick="navigate('jogador',{apelido:'${escAp(a.apelido)}',season:'${state.season}'})"`}>
        <div class="rk ${i<3?'top':''}">${gc?'—':medal(i+1)}</div>
        <div class="av ${i%2?'b':''}" style="${gc?'background:var(--glass-2);color:var(--txt-2);box-shadow:none':''}">${gc?'⚽':initial(a.apelido)}</div>
        <div class="rn" style="${gc?'color:var(--txt-3)':''}">${a.apelido}</div>
        <div class="bar"><i class="${gc?'gc':''}" data-w="${Math.round(a.gols/max*100)}"></i></div>
        <div class="rv ${gc?'muted':''}">${a.gols}</div></div>`;}).join('')}
  </div></div>`;
}

// ── RODADAS ───────────────────────────────────────────────────────
function renderRodadas(){
  const s=S();const rounds=[...s.rounds].reverse();
  return `
  <div class="sec-head"><div class="ic">${I.cal}</div><div><h2>Rodadas</h2><small>${s.total_rodadas} disputadas em ${state.season}</small></div></div>
  <div class="rounds">
    ${rounds.map(r=>{const pf=r.placar_final;const v=venc(pf,r.vencedor);const sc=scorers(r.gols);
      return `<div class="rcard" onclick="navigate('rodada',{num:${r.rodada}})">
        <div class="rcard-h ${v.toLowerCase()}"><span>Rodada ${r.rodada}</span><span>${fmtShort(r.data)}${r.reconstituida?' · <span class="recon">recon.</span>':''}</span></div>
        <div class="rcard-sb">
          <div class="t"><div class="tl">Preto</div><div class="ts ${v==='PRETO'?'win':''}">${pf?pf[0]:'?'}</div></div>
          <div class="x">×</div>
          <div class="t"><div class="tl" style="color:var(--blue-soft)">Azul</div><div class="ts ${v==='AZUL'?'win':''}">${pf?pf[1]:'?'}</div></div>
        </div>
        <div class="rcard-f">${sc.length?`<div class="chips" style="justify-content:flex-start">${sc.slice(0,6).map(([n,g])=>`<span class="chip">${n}${g>1?` <span class="g">×${g}</span>`:''}</span>`).join('')}</div>`:'<span style="color:var(--txt-3);font-size:.78rem">Sem gols registrados</span>'}</div>
      </div>`;}).join('')}
  </div>`;
}

// ── RODADA DETAIL ─────────────────────────────────────────────────
function renderRodadaDetail(num){
  const s=S();const r=s.rounds.find(x=>x.rodada===num);
  if(!r)return `<button class="back" onclick="navigate('rodadas')">← Voltar</button><div class="empty"><div class="e">❓</div>Rodada não encontrada</div>`;
  const pf=r.placar_final;const v=venc(pf,r.vencedor);
  const lu=(players,gols)=>{if(!players?.length)return '<li style="color:var(--txt-2)">Dados não disponíveis</li>';
    return players.map(p=>{const g=gols?.[p]||Object.entries(gols||{}).find(([k])=>k.toUpperCase()===p.toUpperCase())?.[1]||0;
      return `<li><span class="mini" style="width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-family:var(--fd);font-weight:800;font-size:.66rem;color:#06101f;background:linear-gradient(135deg,var(--gold-soft),var(--gold))">${initial(p)}</span>${p}${g>0?`<span class="g">${'⚽'.repeat(Math.min(g,3))}${g>1?' '+g:''}</span>`:''}</li>`;}).join('');};
  const totG=Object.values(r.gols||{}).reduce((a,b)=>a+b,0);
  return `
  <button class="back" onclick="navigate('rodadas')">← Rodadas</button>
  <div class="rd-hero">
    <div class="rd-date">${fmtDate(r.data)}</div>
    <div class="rd-ttl">RODADA ${r.rodada} · ${state.season}</div>
    <div class="rd-sb">
      <div class="t"><div class="tl">Preto</div><div class="ts ${v==='PRETO'?'win':''}">${pf[0]}</div></div>
      <div class="x">×</div>
      <div class="t"><div class="tl az">Azul</div><div class="ts ${v==='AZUL'?'win':''}">${pf[1]}</div></div>
    </div>
    <div style="margin-top:1rem"><span class="res-badge ${v.toLowerCase()}">${v==='EMPATE'?'Empate':'Vitória Time '+(v==='AZUL'?'Azul':'Preto')}</span>
    ${r.reconstituida?'<span class="recon" style="margin-left:.5rem">reconstituída</span>':''}</div>
    ${r.intervalo?`<div style="margin-top:.7rem;font-size:.78rem;color:var(--txt-3)">Intervalo: ${r.intervalo[0]} × ${r.intervalo[1]}</div>`:''}
  </div>
  ${scorers(r.gols).length?`<div class="card" style="margin-bottom:1rem"><div class="card-h green">${I.ball}Marcadores<span class="more">${totG} gols</span></div>
    <div class="card-b"><div class="chips" style="justify-content:flex-start">${scorers(r.gols).map(([n,g])=>`<span class="chip">${n}${g>1?` <span class="g">×${g}</span>`:''}</span>`).join('')}</div></div></div>`:''}
  ${(r.cartoes&&r.cartoes.length)?`<div class="card" style="margin-bottom:1rem"><div class="card-h" style="background:rgba(251,191,36,.1);color:var(--amber)">🟨 Cartões</div>
    <div class="card-b"><div class="chips" style="justify-content:flex-start">${r.cartoes.map(c=>`<span class="chip" style="background:rgba(251,191,36,.12);color:var(--amber);border-color:rgba(251,191,36,.25)">${c.tipo==='CV'?'🟥':c.tipo==='CAz'?'🟦':'🟨'} ${c.jogador} <span class="g">(${c.time})</span></span>`).join('')}</div></div></div>`:''}
  <div class="lineups">
    <div class="lu"><div class="lu-h preto">Time Preto ${v==='PRETO'?'👑':''}</div><ul>${lu(r.time_preto,r.gols)}</ul></div>
    <div class="lu"><div class="lu-h azul">Time Azul ${v==='AZUL'?'👑':''}</div><ul>${lu(r.time_azul,r.gols)}</ul></div>
  </div>`;
}

// ── JOGADORES ─────────────────────────────────────────────────────
function renderJogadores(){
  const s=S();const players=[...s.players].filter(p=>p.jogos>0).sort((a,b)=>a.apelido.localeCompare(b.apelido));
  return `
  <div class="sec-head"><div class="ic">${I.users}</div><div><h2>Elenco</h2><small>${players.length} peladeiros em ${state.season}</small></div></div>
  <div class="search">${I.search}<input id="psearch" placeholder="Buscar peladeiro..." oninput="filterPlayers()"></div>
  <div class="pgrid" id="pgrid">
    ${players.map(p=>`
    <div class="pcard" data-name="${p.apelido.toLowerCase()}" onclick="navigate('jogador',{apelido:'${escAp(p.apelido)}',season:'${state.season}'})">
      <div class="pcard-top"><span class="av" style="width:30px;height:30px;font-size:.78rem">${initial(p.apelido)}</span><b style="font-size:.92rem">${p.apelido}</b>${p.numero?`<span class="num">#${p.numero}</span>`:''}</div>
      <div class="pcard-grid">
        <div><div class="v" style="color:var(--green)">${p.gols}</div><div class="l">Gols</div></div>
        <div><div class="v" style="color:var(--green)">${p.vitorias}</div><div class="l">Vit</div></div>
        <div><div class="v" style="color:var(--gold)">${pts(p)}</div><div class="l">Pts</div></div>
        <div><div class="v" style="color:var(--txt-2)">${p.jogos}</div><div class="l">Jogos</div></div>
      </div>
    </div>`).join('')}
  </div>
  <div id="pgrid-empty" class="empty" style="display:none"><div class="e">🔍</div>Nenhum peladeiro encontrado</div>`;
}
function filterPlayers(){
  const q=document.getElementById('psearch').value.toLowerCase();let n=0;
  document.querySelectorAll('#pgrid .pcard').forEach(el=>{const ok=el.dataset.name.includes(q);el.style.display=ok?'':'none';if(ok)n++;});
  document.getElementById('pgrid-empty').style.display=n?'none':'block';
}

// ── JOGADOR DETAIL ────────────────────────────────────────────────
function renderJogadorDetail(apelido,initSeason){
  const dec=decAp(apelido);const all=allPlayers();
  const found=all.find(p=>p.apelido.toUpperCase()===dec.toUpperCase());
  if(!found)return `<button class="back" onclick="navigate('jogadores')">← Voltar</button><div class="empty"><div class="e">❓</div>Jogador não encontrado</div>`;
  const vs=initSeason||state.season;const p=found.seasons[vs];const nome=found.nome||found.apelido;
  const form=p?playerForm(found.apelido):[];
  return `
  <button class="back" onclick="navigate('jogadores')">← Elenco</button>
  <div class="p-hero">
    <div class="p-av">${initial(found.apelido)}</div>
    <div class="p-info">
      <h1>${found.apelido}</h1>
      ${nome!==found.apelido?`<div class="nm">${nome}</div>`:''}
      <div class="mt">${p?.numero?`<span><b>Camisa</b> #${p.numero}</span>`:''}${p?.data_nasc?`<span><b>Nasc.</b> ${p.data_nasc}</span>`:''}
      ${form.length?`<span class="form" title="Últimos jogos">${form.map(f=>`<i class="${f}"></i>`).join('')}</span>`:''}</div>
    </div>
  </div>
  <div class="styled-tabs">
    ${Object.keys(found.seasons).sort().map(yr=>`<button class="${yr===vs?'active':''}" onclick="navigate('jogador',{apelido:'${escAp(found.apelido)}',season:'${yr}'})">${yr}</button>`).join('')}
  </div>
  ${p?`
  <div class="bento" style="grid-template-columns:repeat(4,1fr)">
    <div class="stat green"><div class="v num">${p.gols??0}</div><div class="l">Gols</div></div>
    <div class="stat"><div class="v num">${p.jogos??0}</div><div class="l">Jogos</div></div>
    <div class="stat green"><div class="v num">${p.vitorias??0}</div><div class="l">Vitórias</div></div>
    <div class="stat"><div class="v num">${p.empates??0}</div><div class="l">Empates</div></div>
    <div class="stat"><div class="v num" style="color:var(--red)">${p.derrotas??0}</div><div class="l">Derrotas</div></div>
    <div class="stat gold"><div class="v num">${pts(p)}</div><div class="l">Pontos</div></div>
    <div class="stat blue"><div class="v num" style="font-size:1.4rem">${pct(p.vitorias,p.jogos)}</div><div class="l">% Vitória</div></div>
    <div class="stat green"><div class="v num" style="font-size:1.4rem">${p.jogos?(p.gols/p.jogos).toFixed(2):'0.00'}</div><div class="l">Gols/Jogo</div></div>
  </div>
  ${(()=>{const c=p.cartoes||{CA:0,CAz:0,CV:0};const t=(c.CA||0)+(c.CAz||0)+(c.CV||0);
    return t?`<div class="card" style="margin-bottom:.9rem"><div class="card-b" style="display:flex;gap:1.2rem;justify-content:center;padding:.9rem">
      <span style="font-size:.85rem">🟨 <b class="num">${c.CA||0}</b></span><span style="font-size:.85rem">🟦 <b class="num">${c.CAz||0}</b></span><span style="font-size:.85rem">🟥 <b class="num">${c.CV||0}</b></span>
      <span style="color:var(--txt-3);font-size:.85rem">· ${p.faltas??0} faltas</span></div></div>`:'';})()}
  <div class="card"><div class="card-h dark">${I.cal}Rodadas em ${vs}</div><div class="card-b">${playerRounds(found.apelido,vs)}</div></div>
  `:`<div class="empty"><div class="e">📅</div>Sem dados para ${vs}</div>`}`;
}
function playerRounds(apelido,season){
  const s=state.seasons[season];if(!s)return '<p style="color:var(--txt-2)">Sem dados</p>';
  const A=apelido.toUpperCase();
  const played=s.rounds.filter(r=>[...(r.time_preto||[]),...(r.time_azul||[])].map(x=>x.toUpperCase()).some(x=>x===A||x.includes(A)||A.includes(x)));
  if(!played.length)return '<p style="color:var(--txt-2)">Não há rodadas registradas.</p>';
  return `<div style="display:flex;flex-direction:column;gap:.5rem">${played.map(r=>{const pf=r.placar_final;
    const inP=(r.time_preto||[]).map(x=>x.toUpperCase()).some(x=>x===A||x.includes(A)||A.includes(x));const team=inP?'PRETO':'AZUL';
    const won=(inP&&pf[0]>pf[1])||(!inP&&pf[1]>pf[0]);const drew=pf[0]===pf[1];const res=drew?'E':won?'V':'D';
    const g=(r.gols||{})[apelido]||Object.entries(r.gols||{}).find(([k])=>k.toUpperCase()===A)?.[1]||0;
    const bc=res==='V'?'b-v':res==='D'?'b-d':'b-e';
    return `<div class="rank-row clk" style="background:var(--glass);border:1px solid var(--bd);border-radius:12px;padding:.55rem .8rem" onclick="navigate('rodada',{num:${r.rodada}})">
      <span style="font-size:.78rem;font-weight:700;color:var(--txt-2);min-width:64px">R${r.rodada} · ${fmtShort(r.data)}</span>
      <span class="num" style="font-weight:700">${pf[0]} × ${pf[1]}</span>
      <span style="font-size:.72rem;color:var(--txt-3)">${team}</span>
      <span class="${bc}" style="margin-left:auto">${res}</span>
      ${g>0?`<span style="color:var(--green);font-weight:700;font-size:.82rem">⚽${g>1?' '+g:''}</span>`:''}</div>`;}).join('')}</div>`;
}

// ── GALERIA ───────────────────────────────────────────────────────
function renderGaleria(){
  return `
  <div class="sec-head"><div class="ic">${I.cam}</div><div><h2>Galeria</h2><small>Momentos da pelada</small></div></div>
  <div class="card" style="margin-bottom:1.2rem"><div class="card-b" style="text-align:center;padding:3rem 2rem">
    <img src="logo.png" style="height:80px;margin:0 auto 1rem;opacity:.85">
    <div style="font-family:var(--fd);font-size:1.15rem;font-weight:700;margin-bottom:.4rem">Em breve</div>
    <div style="color:var(--txt-2);font-size:.9rem;max-width:340px;margin:0 auto">As fotos das peladas e dos churrascos de ${state.season} vão aparecer aqui. Manda as melhores pro grupo!</div>
  </div></div>
  <div class="gal">${Array.from({length:8}).map(()=>'<div class="gslot">＋</div>').join('')}</div>`;
}

// ── Tabs util ─────────────────────────────────────────────────────
function tab(id,btn){
  btn.parentElement.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
  document.getElementById(id).classList.add('active');btn.classList.add('active');
  requestAnimationFrame(()=>document.querySelectorAll('.bar>i[data-w]').forEach(b=>b.style.width=b.dataset.w+'%'));
}

// ── Init ──────────────────────────────────────────────────────────
loadData().catch(e=>{document.getElementById('view').innerHTML=`<div class="empty"><div class="e">⚠️</div><p>Erro ao carregar dados.<br><small style="color:var(--txt-3)">${e.message}</small></p></div>`;});
</script>
</body>
</html>
