<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PSOT — Pelada de Sábado Oito e Trinta</title>
<meta name="description" content="Estatísticas, classificação, artilharia e histórico de rodadas da pelada de sábado do Clube Álvares Cabral, Vitória/ES.">
<meta property="og:title" content="PSOT — Pelada de Sábado Oito e Trinta">
<meta property="og:description" content="Acompanhe a classificação, artilharia e resultados rodada a rodada.">
<meta property="og:url" content="https://psot.site">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>">
<style>
/* ── Reset & Base ──────────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --preto: #1a1a2e;
  --azul: #0d47a1;
  --azul-claro: #1565c0;
  --azul-bg: #e3f2fd;
  --verde: #1b5e20;
  --verde-bg: #e8f5e9;
  --amarelo: #f57f17;
  --amarelo-bg: #fff8e1;
  --cinza: #546e7a;
  --cinza-claro: #eceff1;
  --branco: #ffffff;
  --texto: #212121;
  --texto-suave: #546e7a;
  --borda: #cfd8dc;
  --radius: 10px;
  --shadow: 0 2px 12px rgba(0,0,0,.10);
  --shadow-lg: 0 4px 24px rgba(0,0,0,.14);
}
body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f0f4f8; color: var(--texto); line-height: 1.5; }
a { color: var(--azul); text-decoration: none; }
a:hover { text-decoration: underline; }
button { cursor: pointer; border: none; font-family: inherit; }
img { max-width: 100%; }

/* ── Layout ─────────────────────────────────────────────────────────────────── */
#app { min-height: 100vh; display: flex; flex-direction: column; }
header { background: var(--preto); color: #fff; padding: 0 1rem; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,.3); }
.header-inner { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; gap: 1rem; height: 56px; }
.logo { font-size: 1.4rem; font-weight: 800; letter-spacing: 1px; color: #fff; display: flex; align-items: center; gap: .5rem; }
.logo span { color: var(--amarelo); }
nav { display: flex; gap: .25rem; margin-left: auto; }
nav button { background: transparent; color: rgba(255,255,255,.8); padding: .4rem .75rem; border-radius: 6px; font-size: .85rem; font-weight: 600; transition: all .2s; }
nav button:hover, nav button.active { background: rgba(255,255,255,.15); color: #fff; }
.season-selector { display: flex; gap: .25rem; align-items: center; }
.season-btn { background: rgba(255,255,255,.1); color: rgba(255,255,255,.7); border: 1px solid rgba(255,255,255,.2); padding: .3rem .6rem; border-radius: 20px; font-size: .8rem; font-weight: 700; transition: all .2s; }
.season-btn.active { background: var(--amarelo); color: var(--preto); border-color: var(--amarelo); }
main { flex: 1; max-width: 1100px; margin: 0 auto; padding: 1.5rem 1rem 3rem; width: 100%; }
footer { background: var(--preto); color: rgba(255,255,255,.5); text-align: center; padding: 1rem; font-size: .8rem; }

/* ── Cards & Sections ───────────────────────────────────────────────────────── */
.card { background: var(--branco); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
.card-header { padding: .85rem 1.25rem; display: flex; align-items: center; gap: .5rem; font-weight: 700; font-size: 1rem; border-bottom: 1px solid var(--borda); }
.card-body { padding: 1rem 1.25rem; }
.section-title { font-size: 1.4rem; font-weight: 800; color: var(--preto); margin-bottom: 1.25rem; display: flex; align-items: center; gap: .5rem; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }

/* ── Stat Pills ─────────────────────────────────────────────────────────────── */
.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: .75rem; margin-bottom: 1.5rem; }
.stat-pill { background: var(--branco); border-radius: var(--radius); box-shadow: var(--shadow); padding: 1rem; text-align: center; }
.stat-pill .val { font-size: 2rem; font-weight: 900; color: var(--azul); line-height: 1; }
.stat-pill .lbl { font-size: .75rem; color: var(--texto-suave); margin-top: .25rem; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; }
.stat-pill.green .val { color: var(--verde); }
.stat-pill.amber .val { color: var(--amarelo); }
.stat-pill.dark .val { color: var(--preto); }

/* ── Tables ─────────────────────────────────────────────────────────────────── */
.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { width: 100%; border-collapse: collapse; font-size: .875rem; }
thead th { background: var(--preto); color: #fff; padding: .6rem .75rem; text-align: center; font-size: .75rem; font-weight: 700; letter-spacing: .5px; white-space: nowrap; }
thead th:first-child { text-align: left; padding-left: 1rem; }
tbody tr { border-bottom: 1px solid var(--cinza-claro); transition: background .15s; }
tbody tr:hover { background: var(--cinza-claro); }
tbody tr.gold { background: #fff8e1; }
tbody tr.silver { background: #f5f5f5; }
tbody tr.bronze { background: #fbe9e7; }
tbody td { padding: .55rem .75rem; text-align: center; }
tbody td:first-child { text-align: left; padding-left: 1rem; }
.badge { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 50%; font-weight: 700; font-size: .8rem; }
.badge-v { background: var(--verde-bg); color: var(--verde); }
.badge-d { background: #ffebee; color: #b71c1c; }
.badge-e { background: var(--amarelo-bg); color: var(--amarelo); }
.pts { font-weight: 800; color: var(--azul); }
.gols-bold { font-weight: 700; color: var(--verde); }
.nome-cell { font-weight: 600; }
.ap-tag { background: var(--cinza-claro); color: var(--cinza); font-size: .72rem; padding: .15rem .45rem; border-radius: 4px; margin-left: .4rem; font-weight: 600; }

/* ── Rounds / Histórico ─────────────────────────────────────────────────────── */
.rounds-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1rem; }
.round-card { background: var(--branco); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; cursor: pointer; transition: transform .2s, box-shadow .2s; }
.round-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
.round-header { padding: .6rem 1rem; display: flex; justify-content: space-between; align-items: center; font-size: .8rem; font-weight: 600; }
.round-header.azul { background: var(--azul); color: #fff; }
.round-header.preto { background: var(--preto); color: #fff; }
.round-header.empate { background: #607d8b; color: #fff; }
.round-score { padding: 1rem; display: flex; align-items: center; justify-content: center; gap: 1rem; }
.team-score { text-align: center; }
.team-score .team-name { font-size: .75rem; font-weight: 700; letter-spacing: 1px; color: var(--texto-suave); }
.team-score .score-num { font-size: 2.5rem; font-weight: 900; line-height: 1; }
.score-num.preto-num { color: var(--preto); }
.score-num.azul-num { color: var(--azul); }
.score-divider { font-size: 1.5rem; color: var(--borda); font-weight: 300; }
.round-footer { padding: .5rem 1rem .75rem; font-size: .8rem; color: var(--texto-suave); border-top: 1px solid var(--cinza-claro); }
.scorers-line { display: flex; flex-wrap: wrap; gap: .25rem; margin-top: .3rem; }
.scorer-tag { background: var(--verde-bg); color: var(--verde); padding: .15rem .5rem; border-radius: 12px; font-size: .72rem; font-weight: 600; }

/* ── Round Detail ───────────────────────────────────────────────────────────── */
.round-detail-hero { background: var(--preto); color: #fff; border-radius: var(--radius); padding: 2rem 1.5rem; text-align: center; margin-bottom: 1.5rem; position: relative; overflow: hidden; }
.round-detail-hero::before { content: '⚽'; position: absolute; font-size: 8rem; opacity: .04; top: -1rem; right: -1rem; }
.rnd-date { font-size: .85rem; color: rgba(255,255,255,.6); margin-bottom: .5rem; letter-spacing: 1px; }
.rnd-title { font-size: 1rem; font-weight: 700; color: var(--amarelo); margin-bottom: 1.5rem; letter-spacing: 2px; }
.rnd-scoreboard { display: flex; align-items: center; justify-content: center; gap: 2rem; }
.rnd-team { text-align: center; }
.rnd-team-name { font-size: .75rem; font-weight: 800; letter-spacing: 2px; opacity: .7; }
.rnd-score { font-size: 5rem; font-weight: 900; line-height: 1; }
.rnd-score.winner { color: var(--amarelo); }
.rnd-x { font-size: 2rem; opacity: .4; }
.rnd-result-badge { display: inline-block; margin-top: 1rem; padding: .35rem 1rem; border-radius: 20px; font-size: .8rem; font-weight: 700; letter-spacing: 1px; }
.rnd-result-badge.azul { background: var(--azul); }
.rnd-result-badge.preto { background: rgba(255,255,255,.15); }
.rnd-result-badge.empate { background: #607d8b; }
.lineups { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.5rem; }
.lineup-card { background: var(--branco); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
.lineup-title { padding: .65rem 1rem; font-weight: 700; font-size: .85rem; letter-spacing: 1px; }
.lineup-title.preto { background: var(--preto); color: #fff; }
.lineup-title.azul { background: var(--azul); color: #fff; }
.lineup-list { list-style: none; padding: .5rem 0; }
.lineup-list li { padding: .35rem 1rem; font-size: .875rem; display: flex; align-items: center; gap: .4rem; border-bottom: 1px solid var(--cinza-claro); }
.lineup-list li:last-child { border-bottom: none; }
.goal-icon { color: var(--verde); font-size: .9rem; }

/* ── Player Profile ─────────────────────────────────────────────────────────── */
.player-hero { background: linear-gradient(135deg, var(--preto) 0%, var(--azul-claro) 100%); color: #fff; border-radius: var(--radius); padding: 2rem 1.5rem; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 1.5rem; }
.player-avatar { width: 80px; height: 80px; border-radius: 50%; background: rgba(255,255,255,.15); display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: 900; flex-shrink: 0; border: 3px solid rgba(255,255,255,.3); }
.player-info h1 { font-size: 1.6rem; font-weight: 900; }
.player-info .player-apelido { font-size: .9rem; color: rgba(255,255,255,.6); margin-top: .15rem; }
.player-info .player-meta { font-size: .8rem; color: rgba(255,255,255,.5); margin-top: .25rem; }
.seasons-tabs { display: flex; gap: .5rem; margin-bottom: 1rem; }
.season-tab { padding: .4rem .9rem; border-radius: 20px; border: 2px solid var(--borda); background: var(--branco); font-weight: 700; font-size: .85rem; color: var(--texto-suave); transition: all .2s; }
.season-tab.active { background: var(--azul); color: #fff; border-color: var(--azul); }

/* ── Artilharia ─────────────────────────────────────────────────────────────── */
.art-row { display: flex; align-items: center; gap .75rem; padding: .65rem 0; border-bottom: 1px solid var(--cinza-claro); }
.art-pos { width: 32px; text-align: center; font-weight: 700; font-size: .9rem; }
.art-name { flex: 1; font-weight: 600; }
.art-gols { font-weight: 800; color: var(--verde); font-size: 1rem; min-width: 28px; text-align: right; }
.art-bar-wrap { width: 100px; background: var(--cinza-claro); border-radius: 4px; height: 8px; overflow: hidden; }
.art-bar { height: 100%; background: var(--verde); border-radius: 4px; }

/* ── Utilities ──────────────────────────────────────────────────────────────── */
.back-btn { display: inline-flex; align-items: center; gap: .35rem; color: var(--azul); font-weight: 600; margin-bottom: 1rem; font-size: .875rem; cursor: pointer; background: none; border: none; padding: 0; }
.back-btn:hover { text-decoration: underline; }
.tag-azul { background: var(--azul-bg); color: var(--azul); padding: .15rem .5rem; border-radius: 4px; font-size: .72rem; font-weight: 700; }
.tag-preto { background: #eceff1; color: var(--preto); padding: .15rem .5rem; border-radius: 4px; font-size: .72rem; font-weight: 700; }
.tag-empate { background: #fff9c4; color: #e65100; padding: .15rem .5rem; border-radius: 4px; font-size: .72rem; font-weight: 700; }
.empty-state { text-align: center; padding: 3rem 1rem; color: var(--texto-suave); }
.empty-state .icon { font-size: 3rem; margin-bottom: .5rem; }
.loading { text-align: center; padding: 4rem; color: var(--texto-suave); font-size: 1.1rem; }
.reconstituida-badge { background: var(--amarelo-bg); color: var(--amarelo); font-size: .7rem; padding: .1rem .4rem; border-radius: 4px; font-weight: 600; }
.search-box { width: 100%; padding: .6rem 1rem; border: 2px solid var(--borda); border-radius: 8px; font-size: .9rem; margin-bottom: 1rem; outline: none; transition: border .2s; }
.search-box:focus { border-color: var(--azul); }
.tabs { display: flex; gap: .25rem; border-bottom: 2px solid var(--borda); margin-bottom: 1.25rem; overflow-x: auto; }
.tab-btn { padding: .55rem 1rem; background: none; border: none; font-weight: 600; font-size: .875rem; color: var(--texto-suave); border-bottom: 2px solid transparent; margin-bottom: -2px; white-space: nowrap; transition: all .2s; }
.tab-btn.active { color: var(--azul); border-bottom-color: var(--azul); }
.tab-content { display: none; }
.tab-content.active { display: block; }

/* ── Responsive ─────────────────────────────────────────────────────────────── */
@media (max-width: 680px) {
  .grid-2, .grid-3, .lineups { grid-template-columns: 1fr; }
  nav button span.label { display: none; }
  .rounds-grid { grid-template-columns: 1fr; }
  .player-hero { flex-direction: column; text-align: center; }
  .rnd-score { font-size: 3.5rem; }
  .header-inner { gap: .5rem; }
  .season-selector { display: none; }
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="header-inner">
      <div class="logo">⚽ <span>PSOT</span></div>
      <nav id="main-nav">
        <button onclick="navigate('home')" class="active" data-page="home">🏠 <span class="label">Início</span></button>
        <button onclick="navigate('classificacao')" data-page="classificacao">📊 <span class="label">Classificação</span></button>
        <button onclick="navigate('artilharia')" data-page="artilharia">⚽ <span class="label">Artilharia</span></button>
        <button onclick="navigate('rodadas')" data-page="rodadas">📅 <span class="label">Rodadas</span></button>
        <button onclick="navigate('jogadores')" data-page="jogadores">👥 <span class="label">Jogadores</span></button>
      </nav>
      <div class="season-selector" id="season-selector"></div>
    </div>
  </header>
  <main id="main-content">
    <div class="loading">⚽ Carregando dados...</div>
  </main>
  <footer>
    <strong>PSOT</strong> — Pelada de Sábado Oito e Trinta · Clube Álvares Cabral, Vitória/ES
    <span id="footer-updated" style="margin-left:.5rem;opacity:.6;"></span>
  </footer>
</div>

<script>
// ── State ─────────────────────────────────────────────────────────────────────
const state = {
  currentPage: 'home',
  currentSeason: '2026',
  seasons: {},
  config: null,
};

// ── Data Loading ─────────────────────────────────────────────────────────────
async function loadData() {
  const [cfg, s2025, s2026] = await Promise.all([
    fetch('data/config.json').then(r => r.json()),
    fetch('data/2025.json').then(r => r.json()),
    fetch('data/2026.json').then(r => r.json()),
  ]);
  state.config = cfg;
  state.seasons['2025'] = s2025;
  state.seasons['2026'] = s2026;
  state.currentSeason = cfg.current_season;
  document.getElementById('footer-updated').textContent = `Atualizado em ${cfg.updated}`;
  buildSeasonSelector();
  navigate(state.currentPage);
}

function buildSeasonSelector() {
  const sel = document.getElementById('season-selector');
  sel.innerHTML = state.config.seasons.map(s =>
    `<button class="season-btn ${s === state.currentSeason ? 'active' : ''}" onclick="setSeason('${s}')">${s}</button>`
  ).join('');
}

function setSeason(s) {
  state.currentSeason = s;
  buildSeasonSelector();
  navigate(state.currentPage);
}

function getSeason() { return state.seasons[state.currentSeason]; }

// ── Router ────────────────────────────────────────────────────────────────────
function navigate(page, params = {}) {
  state.currentPage = page.split(':')[0];
  document.querySelectorAll('#main-nav button').forEach(b => {
    b.classList.toggle('active', b.dataset.page === state.currentPage);
  });
  const el = document.getElementById('main-content');
  switch (state.currentPage) {
    case 'home':          el.innerHTML = renderHome(); break;
    case 'classificacao': el.innerHTML = renderClassificacao(); break;
    case 'artilharia':    el.innerHTML = renderArtilharia(); break;
    case 'rodadas':       el.innerHTML = renderRodadas(); break;
    case 'rodada':        el.innerHTML = renderRodadaDetail(params.num); break;
    case 'jogadores':     el.innerHTML = renderJogadores(); break;
    case 'jogador':       el.innerHTML = renderJogadorDetail(params.apelido, params.season); break;
  }
  window.scrollTo(0, 0);
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function fmtDate(d) {
  if (!d) return '';
  const [dd, mm, yyyy] = d.split('.');
  const months = ['','Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  return `${parseInt(dd)} ${months[parseInt(mm)]} ${yyyy}`;
}

function vencTag(v) {
  if (!v) return '';
  if (v === 'AZUL')   return `<span class="tag-azul">Azul Vence</span>`;
  if (v === 'PRETO')  return `<span class="tag-preto">Preto Vence</span>`;
  return `<span class="tag-empate">Empate</span>`;
}

function medalPos(p) {
  if (p === 1) return '🥇';
  if (p === 2) return '🥈';
  if (p === 3) return '🥉';
  return p;
}

function rowClass(p) {
  if (p === 1) return 'gold';
  if (p === 2) return 'silver';
  if (p === 3) return 'bronze';
  return '';
}

function pct(v, j) { return j > 0 ? Math.round(v / j * 100) + '%' : '—'; }
function pts(p) { return (p.vitorias || 0) * 3 + (p.empates || 0); }

function allPlayers() {
  const seen = {};
  ['2025','2026'].forEach(yr => {
    const s = state.seasons[yr];
    if (!s) return;
    s.players.forEach(p => {
      const key = p.apelido.toUpperCase();
      if (!seen[key]) seen[key] = { apelido: p.apelido, nome: p.nome, seasons: {} };
      seen[key].seasons[yr] = p;
    });
  });
  return Object.values(seen);
}

function scorersText(gols) {
  if (!gols || !Object.keys(gols).length) return '';
  return Object.entries(gols)
    .filter(([, g]) => g > 0)
    .sort(([, a], [, b]) => b - a)
    .map(([n, g]) => g > 1 ? `${n} (${g})` : n)
    .join(', ');
}

// ── Home ──────────────────────────────────────────────────────────────────────
function renderHome() {
  const s = getSeason();
  const st = s.stats;
  const top3art = s.artilharia.slice(0, 3);
  const lastRound = s.rounds[s.rounds.length - 1];
  const top5class = [...s.players]
    .filter(p => p.jogos > 0)
    .sort((a, b) => pts(b) - pts(a) || b.gols - a.gols)
    .slice(0, 5);

  return `
  <div class="section-title">⚽ Temporada ${state.currentSeason}</div>

  <div class="stat-grid">
    <div class="stat-pill"><div class="val">${s.total_rodadas}</div><div class="lbl">Rodadas</div></div>
    <div class="stat-pill green"><div class="val">${st.total_gols}</div><div class="lbl">Gols</div></div>
    <div class="stat-pill amber"><div class="val">${st.media_gols}</div><div class="lbl">Média/Jogo</div></div>
    <div class="stat-pill dark"><div class="val">${s.players.filter(p=>p.jogos>0).length}</div><div class="lbl">Jogadores</div></div>
    <div class="stat-pill"><div class="val">${st.vitoria_azul}</div><div class="lbl">Vitórias Azul</div></div>
    <div class="stat-pill dark"><div class="val">${st.vitoria_preto}</div><div class="lbl">Vitórias Preto</div></div>
    <div class="stat-pill amber"><div class="val">${st.empates}</div><div class="lbl">Empates</div></div>
  </div>

  <div class="grid-2" style="gap:1rem;margin-bottom:1rem;">
    <div class="card">
      <div class="card-header" style="background:var(--preto);color:#fff;">
        📅 Última Rodada · R${lastRound?.rodada || '—'}
      </div>
      <div class="card-body">
        ${lastRound ? `
          <div style="text-align:center;padding:.5rem 0;">
            <div style="font-size:.8rem;color:var(--texto-suave);margin-bottom:.5rem;">${fmtDate(lastRound.data)}</div>
            <div style="display:flex;align-items:center;justify-content:center;gap:1.5rem;margin-bottom:.75rem;">
              <div style="text-align:center;">
                <div style="font-size:.7rem;font-weight:700;letter-spacing:1px;color:var(--cinza);">PRETO</div>
                <div style="font-size:3.5rem;font-weight:900;color:var(--preto);">${lastRound.placar_final[0]}</div>
              </div>
              <div style="font-size:1.5rem;color:var(--borda);">×</div>
              <div style="text-align:center;">
                <div style="font-size:.7rem;font-weight:700;letter-spacing:1px;color:var(--azul);">AZUL</div>
                <div style="font-size:3.5rem;font-weight:900;color:var(--azul);">${lastRound.placar_final[1]}</div>
              </div>
            </div>
            ${vencTag(lastRound.vencedor)}
          </div>
          ${Object.keys(lastRound.gols||{}).length ? `
            <div style="margin-top:.75rem;padding-top:.75rem;border-top:1px solid var(--cinza-claro);">

      <button onclick="navigate('classificacao')" style="background:transparent;color:var(--azul);border:1.5px solid var(--azul);padding:.35rem .9rem;border-radius:6px;font-size:.8rem;font-weight:600;">Ver classificação completa →</button>

// ── Classificação ─────────────────────────────────────────────────────────────
function renderClassificacao() {
  const s = getSeason();
  const totalRodadas = s.total_rodadas;
  const minJogos = Math.floor(totalRodadas / 2);

  const ativos = [...s.players].filter(p => p.jogos > 0)
    .sort((a, b) => pts(b) - pts(a) || b.gols - a.gols || a.apelido.localeCompare(b.apelido));

  const elegiveis = ativos.filter(p => p.jogos >= minJogos);
  const inativos  = ativos.filter(p => p.jogos < minJogos);

  const tabela = (lista, startPos = 1) => lista.map((p, i) => {
    const pos = startPos + i;
    const pv = pct(p.vitorias, p.jogos);
    return `<tr class="${rowClass(pos)}" style="cursor:pointer;" onclick="navigate('jogador',{apelido:'${escAp(p.apelido)}',season:'${state.currentSeason}'})">
      <td>${medalPos(pos)}</td>
      <td class="nome-cell">${p.apelido}</td>
      <td>${p.jogos}/${totalRodadas}</td>
      <td><span class="badge badge-v">${p.vitorias}</span></td>
      <td>${p.empates ?? 0}</td>
      <td>${p.derrotas ?? 0}</td>
      <td class="pts">${pts(p)}</td>
      <td class="gols-bold">${p.gols}</td>
      <td>${pv}</td>
    </tr>`;
  }).join('');

  return `
  <div class="section-title">📊 Classificação ${state.currentSeason}</div>
  <div class="tabs">
    <button class="tab-btn active" onclick="showTab('tab-geral',this)">Geral (pontos)</button>
    <button class="tab-btn" onclick="showTab('tab-pct',this)">Ranking por % <span style="background:var(--amarelo-bg);color:var(--amarelo);font-size:.7rem;padding:.1rem .35rem;border-radius:4px;margin-left:.3rem;">mín ${minJogos}j</span></button>
  </div>

  <div id="tab-geral" class="tab-content active">
    <div class="card">
      <div class="table-wrap">
        <table>
          <thead><tr><th>#</th><th>Jogador</th><th>J</th><th>V</th><th>E</th><th>D</th><th>PTS</th><th>Gols</th><th>% Vit</th></tr></thead>
          <tbody>${tabela(ativos)}</tbody>
        </table>
      </div>
    </div>
    <p style="font-size:.75rem;color:var(--texto-suave);margin-top:.5rem;padding-left:.25rem;">PTS = Vitórias×3 + Empates×1</p>
  </div>

  <div id="tab-pct" class="tab-content">
    ${(() => {
      const rankPct = elegiveis.sort((a,b) =>
        (b.vitorias/b.jogos - a.vitorias/a.jogos) || pts(b)-pts(a) || b.gols-a.gols
      );
      return `
      <div class="card">
        <div class="table-wrap">
          <table>
            <thead><tr><th>#</th><th>Jogador</th><th>J</th><th>V</th><th>E</th><th>D</th><th>PTS</th><th>Gols</th><th>% Vit</th></tr></thead>
            <tbody>${tabela(rankPct)}</tbody>
          </table>
        </div>
      </div>
      ${inativos.length ? `
      <div style="margin-top:1rem;" class="card">
        <div class="card-header" style="background:var(--amarelo-bg);color:var(--amarelo);">⚠️ Amostra insuficiente — menos de ${minJogos} jogos</div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>#</th><th>Jogador</th><th>J</th><th>V</th><th>E</th><th>D</th><th>Gols</th><th>% Vit</th></tr></thead>
            <tbody>${inativos.map((p,i) => `<tr style="opacity:.6;cursor:pointer;" onclick="navigate('jogador',{apelido:'${escAp(p.apelido)}',season:'${state.currentSeason}'})">
              <td>—</td><td>${p.apelido}</td><td>${p.jogos}</td><td>${p.vitorias}</td><td>${p.empates??0}</td><td>${p.derrotas??0}</td><td>${p.gols}</td><td>${pct(p.vitorias,p.jogos)}</td></tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>` : ''}
      <p style="font-size:.75rem;color:var(--texto-suave);margin-top:.5rem;padding-left:.25rem;">Mínimo de ${minJogos} jogos (⌊${totalRodadas}÷2⌋) para entrar no ranking por %</p>`;
    })()}
  </div>`;
}

// ── Artilharia ────────────────────────────────────────────────────────────────

// ── Rodadas ───────────────────────────────────────────────────────────────────
function renderRodadas() {

  <div class="rounds-grid">
    ${rounds.map(r => {
      const pf = r.placar_final;
      const v = r.vencedor || (pf ? (pf[0]>pf[1]?'PRETO':pf[1]>pf[0]?'AZUL':'EMPATE') : 'EMPATE');

      const scorers = scorersText(r.gols);
      return `
      <div class="round-card" onclick="navigate('rodada',{num:${r.rodada}})">
        <div class="round-header ${hdrClass}">
          <span>Rodada ${r.rodada}</span>

          <div class="team-score">
            <div class="team-name">PRETO</div>
            <div class="score-num preto-num ${v==='PRETO'?'winner':''}" style="${v==='PRETO'?'color:var(--amarelo)':''}">${pf?pf[0]:'?'}</div>

// ── Rodada Detail ─────────────────────────────────────────────────────────────
function renderRodadaDetail(num) {
  const s = getSeason();
  const r = s.rounds.find(x => x.rodada === num);
  if (!r) return `<button class="back-btn" onclick="navigate('rodadas')">← Voltar</button><div class="empty-state"><div class="icon">❓</div>Rodada não encontrada</div>`;

  const pf = r.placar_final;
  const v = r.vencedor || (pf[0]>pf[1]?'PRETO':pf[1]>pf[0]?'AZUL':'EMPATE');
  const pretoWin = v === 'PRETO', azulWin = v === 'AZUL';

  const lineupHtml = (players, gols, side) => {
    if (!players?.length) return '<li style="padding:.5rem 1rem;color:var(--texto-suave);font-size:.85rem;">Dados não disponíveis</li>';
    return players.map(p => {
      const g = gols?.[p] || 0;
      return `<li>${p}${g > 0 ? ` <span class="goal-icon">${'⚽'.repeat(g)}</span>` : ''}</li>`;
    }).join('');
  };

  return `
  <button class="back-btn" onclick="navigate('rodadas')">← Voltar às Rodadas</button>

  <div class="round-detail-hero">
    <div class="rnd-date">${fmtDate(r.data)}</div>
    <div class="rnd-title">RODADA ${r.rodada} · ${state.currentSeason}</div>
    <div class="rnd-scoreboard">
      <div class="rnd-team">
        <div class="rnd-team-name">PRETO</div>
        <div class="rnd-score ${pretoWin ? 'winner' : ''}">${pf[0]}</div>
      </div>
      <div class="rnd-x">×</div>
      <div class="rnd-team">
        <div class="rnd-team-name">AZUL</div>
        <div class="rnd-score ${azulWin ? 'winner' : ''}">${pf[1]}</div>
      </div>
    </div>
    <div>
      <span class="rnd-result-badge ${v.toLowerCase()}">
        ${v === 'EMPATE' ? 'Empate' : `Vitória ${v === 'AZUL' ? 'Time Azul' : 'Time Preto'}`}
      </span>
      ${r.reconstituida ? '<span style="background:rgba(255,255,255,.15);color:rgba(255,255,255,.8);font-size:.7rem;padding:.2rem .5rem;border-radius:4px;margin-left:.5rem;">reconstituída</span>' : ''}
    </div>
    ${r.intervalo ? `<div style="margin-top:.75rem;font-size:.8rem;opacity:.6;">Intervalo: ${r.intervalo[0]} × ${r.intervalo[1]}</div>` : ''}
  </div>

  ${Object.keys(r.gols||{}).length ? `
  <div class="card" style="margin-bottom:1rem;">
    <div class="card-header" style="background:var(--verde);color:#fff;">⚽ Marcadores</div>
    <div class="card-body">
      <div class="scorers-line">
        ${Object.entries(r.gols).filter(([,g])=>g>0).sort(([,a],[,b])=>b-a).map(([n,g])=>`<span class="scorer-tag" style="font-size:.85rem;padding:.3rem .75rem;">${n}${g>1?' ('+g+')':''}</span>`).join('')}
      </div>
      <div style="margin-top:.75rem;font-size:.8rem;color:var(--texto-suave);">
        Total: ${Object.values(r.gols).reduce((a,b)=>a+b,0)} gols
      </div>
    </div>
  </div>` : ''}

  <div class="lineups">
    <div class="lineup-card">
      <div class="lineup-title preto">⬛ TIME PRETO ${pretoWin ? '🏆' : ''}</div>
      <ul class="lineup-list">${lineupHtml(r.time_preto, r.gols, 'preto')}</ul>
    </div>
    <div class="lineup-card">
      <div class="lineup-title azul">🟦 TIME AZUL ${azulWin ? '🏆' : ''}</div>
      <ul class="lineup-list">${lineupHtml(r.time_azul, r.gols, 'azul')}</ul>
    </div>
  </div>`;
}

// ── Jogadores ─────────────────────────────────────────────────────────────────

  return `
  <div class="section-title">👥 Jogadores ${state.currentSeason}</div>
  <input class="search-box" id="player-search" placeholder="🔍  Buscar jogador..." oninput="filterPlayers()" />

    ${players.map(p => `
    <div class="round-card" onclick="navigate('jogador',{apelido:'${escAp(p.apelido)}',season:'${state.currentSeason}'})" data-name="${p.apelido.toLowerCase()}">
      <div class="round-header preto">
        <span style="font-size:1rem;">👤 ${p.apelido}</span>
        ${p.numero ? `<span style="background:rgba(255,255,255,.2);padding:.15rem .5rem;border-radius:4px;font-size:.8rem;">#${p.numero}</span>` : ''}
      </div>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);text-align:center;padding:.75rem .5rem;">

        <div><div style="font-size:1.4rem;font-weight:900;color:var(--azul);">${pts(p)}</div><div style="font-size:.65rem;color:var(--texto-suave);font-weight:600;">PTS</div></div>
        <div><div style="font-size:1.4rem;font-weight:900;color:var(--cinza);">${p.jogos}</div><div style="font-size:.65rem;color:var(--texto-suave);font-weight:600;">JOGOS</div></div>

function filterPlayers() {
  const q = document.getElementById('player-search').value.toLowerCase();
  document.querySelectorAll('#players-grid .round-card').forEach(el => {
    el.style.display = el.dataset.name.includes(q) ? '' : 'none';
  });
}

// ── Jogador Detail ────────────────────────────────────────────────────────────
function renderJogadorDetail(apelido, initSeason) {
  const decoded = decodeAp(apelido);
  const all = allPlayers();
  const found = all.find(p => p.apelido.toUpperCase() === decoded.toUpperCase());
  if (!found) return `<button class="back-btn" onclick="navigate('jogadores')">← Voltar</button><div class="empty-state"><div class="icon">❓</div>Jogador não encontrado</div>`;

  const viewSeason = initSeason || state.currentSeason;
  const p = found.seasons[viewSeason];
  const pOther = found.seasons[viewSeason === '2026' ? '2025' : '2026'];

  const initial = found.apelido.charAt(0).toUpperCase();
  const nome = found.nome || found.apelido;

  return `
  <button class="back-btn" onclick="navigate('jogadores')">← Voltar aos Jogadores</button>

  <div class="player-hero">
    <div class="player-avatar">${initial}</div>
    <div class="player-info">
      <h1>${found.apelido}</h1>
      <div class="player-apelido">${nome !== found.apelido ? nome : ''}</div>
      ${p?.data_nasc ? `<div class="player-meta">🎂 ${p.data_nasc}</div>` : ''}
      ${p?.numero ? `<div class="player-meta">Camisa #${p.numero}</div>` : ''}
    </div>
  </div>

  <div class="seasons-tabs">
    ${Object.keys(found.seasons).map(yr => `
      <button class="season-tab ${yr === viewSeason ? 'active' : ''}"
        onclick="navigate('jogador',{apelido:'${escAp(found.apelido)}',season:'${yr}'})">${yr}</button>
    `).join('')}
  </div>

  ${p ? `
  <div class="stat-grid">
    <div class="stat-pill green"><div class="val">${p.gols??0}</div><div class="lbl">Gols</div></div>
    <div class="stat-pill"><div class="val">${p.jogos??0}</div><div class="lbl">Jogos</div></div>
    <div class="stat-pill green"><div class="val">${p.vitorias??0}</div><div class="lbl">Vitórias</div></div>
    <div class="stat-pill amber"><div class="val">${p.empates??0}</div><div class="lbl">Empates</div></div>
    <div class="stat-pill"><div class="val" style="color:#b71c1c;">${p.derrotas??0}</div><div class="lbl">Derrotas</div></div>
    <div class="stat-pill dark"><div class="val">${pts(p)}</div><div class="lbl">PTS</div></div>
    <div class="stat-pill amber"><div class="val">${pct(p.vitorias, p.jogos)}</div><div class="lbl">% Vitória</div></div>
    ${p.jogos>0?`<div class="stat-pill green"><div class="val">${p.gols && p.jogos ? (p.gols/p.jogos).toFixed(2) : '0.00'}</div><div class="lbl">Gols/Jogo</div></div>`:''}

  <div class="card">

      ${renderPlayerRounds(found.apelido, viewSeason)}
    </div>
  </div>
  ` : `<div class="empty-state"><div class="icon">📅</div>Sem dados para ${viewSeason}</div>`}`;
}

function renderPlayerRounds(apelido, season) {
  const s = state.seasons[season];
  if (!s) return '<p style="color:var(--texto-suave);">Sem dados</p>';

  const ap = apelido.toUpperCase();
  const played = s.rounds.filter(r => {
    const all = [...(r.time_preto||[]), ...(r.time_azul||[])].map(x => x.toUpperCase());
    return all.some(x => x === ap || x.includes(ap) || ap.includes(x));
  });

  if (!played.length) return '<p style="color:var(--texto-suave);">Não há rodadas registradas.</p>';

  return `<div style="display:flex;flex-direction:column;gap:.5rem;">
    ${played.map(r => {
      const pf = r.placar_final;
      const v = r.vencedor || (pf[0]>pf[1]?'PRETO':pf[1]>pf[0]?'AZUL':'EMPATE');
      const inPreto = (r.time_preto||[]).map(x=>x.toUpperCase()).some(x => x === ap || x.includes(ap) || ap.includes(x));
      const myTeam = inPreto ? 'PRETO' : 'AZUL';
      const won = (myTeam === 'PRETO' && pf[0]>pf[1]) || (myTeam === 'AZUL' && pf[1]>pf[0]);
      const drew = pf[0] === pf[1];
      const gols = (r.gols||{})[apelido] || Object.entries(r.gols||{}).find(([k])=>k.toUpperCase()===ap)?.[1] || 0;
      const result = drew ? 'E' : won ? 'V' : 'D';
      const badgeClass = result === 'V' ? 'badge-v' : result === 'D' ? 'badge-d' : 'badge-e';
      return `
      <div style="display:flex;align-items:center;gap:.75rem;padding:.5rem .75rem;background:var(--cinza-claro);border-radius:8px;cursor:pointer;" onclick="navigate('rodada',{num:${r.rodada}})">
        <span style="font-size:.8rem;font-weight:700;min-width:70px;">R${r.rodada} · ${r.data?.split('.').slice(0,2).join('/')}</span>
        <span style="font-size:.8rem;">${pf[0]} × ${pf[1]}</span>
        <span style="font-size:.75rem;color:var(--texto-suave);">(${myTeam})</span>
        <span class="badge ${badgeClass}">${result}</span>
        ${gols > 0 ? `<span style="font-size:.8rem;color:var(--verde);font-weight:700;">${'⚽'.repeat(Math.min(gols,5))} ${gols > 1 ? gols+'g' : ''}</span>` : ''}
      </div>`;
    }).join('')}
  </div>`;
}

// ── Utils ─────────────────────────────────────────────────────────────────────
function escAp(ap) { return encodeURIComponent(ap); }
function decodeAp(ap) { return decodeURIComponent(ap); }

function showTab(id, btn) {
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  btn.classList.add('active');
}

// ── Init ──────────────────────────────────────────────────────────────────────
loadData().catch(e => {
  document.getElementById('main-content').innerHTML =
    `<div class="empty-state"><div class="icon">⚠️</div><p>Erro ao carregar dados.<br><small>${e.message}</small></p></div>`;
});
</script>
</body>
</html>
