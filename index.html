<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PSOT — Pelada de Sábado Oito e Trinta</title>
<meta name="description" content="Estatísticas, classificação, artilharia e histórico de rodadas da pelada de sábado do Clube Álvares Cabral, Vitória/ES.">
<meta property="og:title" content="PSOT — Pelada de Sábado Oito e Trinta">
<meta property="og:description" content="Acompanhe a classificação, artilharia e resultados rodada a rodada.">
<meta property="og:url" content="https://psot.site">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>">
<style>
/* ── Reset & Variables ──────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --navy:       #07101f;
  --gold:       #f0b429;
  --gold-dim:   rgba(240,180,41,.18);
  --blue-vivid: #1a6cf5;
  --glass:      rgba(255,255,255,.07);
  --glass-md:   rgba(255,255,255,.12);
  --glass-hi:   rgba(255,255,255,.18);
  --glass-bd:   rgba(255,255,255,.12);
  --text:       rgba(255,255,255,.92);
  --text-dim:   rgba(255,255,255,.52);
  --text-faint: rgba(255,255,255,.28);
  --green:      #34d399;
  --red:        #f87171;
  --amber:      #fbbf24;
  --blue-light: #7eb8ff;
  --radius:     16px;
  --radius-lg:  22px;
  --radius-pill:50px;
}

body {
  font-family: -apple-system, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif;
  background: linear-gradient(160deg, #060e1c 0%, #0b1d38 50%, #080f1f 100%);
  background-attachment: fixed;
  color: var(--text);
  line-height: 1.5;
  min-height: 100vh;
  overflow-x: hidden;
}

a { color: var(--gold); text-decoration: none; }
button { cursor: pointer; border: none; font-family: inherit; }
img { max-width: 100%; }

/* ── Background Orbs ────────────────────────────────────────────────────────── */
.bg-orbs { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.orb { position: absolute; border-radius: 50%; filter: blur(90px); }
.orb-1 { width: 700px; height: 700px; background: radial-gradient(circle, #1a4a9e 0%, transparent 70%); top: -200px; left: -180px; opacity: .22; animation: float1 22s ease-in-out infinite; }
.orb-2 { width: 500px; height: 500px; background: radial-gradient(circle, #c8860a 0%, transparent 70%); bottom: -80px; right: -100px; opacity: .1; animation: float2 28s ease-in-out infinite; }
.orb-3 { width: 450px; height: 450px; background: radial-gradient(circle, #1a6cf5 0%, transparent 70%); top: 40%; left: 55%; opacity: .08; animation: float3 19s ease-in-out infinite; }

@keyframes float1 { 0%,100% { transform: translate(0,0); } 33% { transform: translate(50px,70px); } 66% { transform: translate(-30px,35px); } }
@keyframes float2 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-70px,-55px); } }
@keyframes float3 { 0%,100% { transform: translate(-50%,-50%); } 50% { transform: translate(-50%,-50%) scale(1.25); } }

/* ── App Shell ──────────────────────────────────────────────────────────────── */
#app { position: relative; z-index: 1; min-height: 100vh; display: flex; flex-direction: column; }

/* ── Season Selector — top left ─────────────────────────────────────────────── */
#season-wrapper { position: fixed; top: 16px; left: 20px; z-index: 300; }

.season-toggle-btn {
  display: flex; align-items: center; gap: 8px;
  background: var(--gold-dim);
  border: 1px solid rgba(240,180,41,.38);
  backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px);
  color: var(--gold);
  padding: 8px 14px; border-radius: var(--radius-pill);
  font-size: .78rem; font-weight: 800; letter-spacing: .8px; text-transform: uppercase;
  transition: all .2s; white-space: nowrap; cursor: pointer;
}
.season-toggle-btn:hover { background: rgba(240,180,41,.28); }
.season-toggle-btn svg { transition: transform .25s; flex-shrink: 0; }
.season-toggle-btn.open svg { transform: rotate(180deg); }

#season-dropdown {
  margin-top: 8px; min-width: 148px;
  background: rgba(8,18,40,.88);
  backdrop-filter: blur(26px); -webkit-backdrop-filter: blur(26px);
  border: 1px solid var(--glass-bd); border-radius: var(--radius);
  box-shadow: 0 20px 60px rgba(0,0,0,.45);
  overflow: hidden; display: none;
}
#season-dropdown.open { display: block; }

.season-option {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 16px; width: 100%; text-align: left;
  font-size: .88rem; font-weight: 700;
  color: var(--text-dim); background: transparent; border: none; cursor: pointer;
  transition: all .15s;
}
.season-option:hover { background: var(--glass); color: var(--text); }
.season-option.active { color: var(--gold); }
.season-option .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-faint); flex-shrink: 0; }
.season-option.active .dot { background: var(--gold); }
.season-option .cur-tag { font-size: .65rem; font-weight: 500; color: var(--text-faint); margin-left: auto; }

/* ── Floating Nav ───────────────────────────────────────────────────────────── */
#main-nav {
  position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 200;
  display: flex; align-items: center; gap: 3px;
  background: rgba(8,20,45,.72);
  backdrop-filter: blur(26px); -webkit-backdrop-filter: blur(26px);
  border: 1px solid var(--glass-bd); border-radius: var(--radius-pill);
  padding: 6px; white-space: nowrap;
  box-shadow: 0 8px 32px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.07);
}
.nav-btn {
  background: transparent; color: var(--text-dim);
  padding: 8px 16px; border-radius: 40px;
  font-size: .8rem; font-weight: 600; letter-spacing: .2px;
  transition: all .2s;
}
.nav-btn:hover { color: var(--text); background: var(--glass); }
.nav-btn.active {
  background: rgba(255,255,255,.13); color: #fff;
  box-shadow: 0 2px 10px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.13);
}

/* ── Main Content ───────────────────────────────────────────────────────────── */
main { flex: 1; max-width: 1100px; margin: 0 auto; padding: 96px 20px 80px; width: 100%; }

/* ── Footer ─────────────────────────────────────────────────────────────────── */
footer {
  text-align: center; padding: 1.25rem; font-size: .8rem;
  color: var(--text-faint); border-top: 1px solid var(--glass-bd);
}

/* ── Glass Card ─────────────────────────────────────────────────────────────── */
.card {
  background: var(--glass);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--glass-bd); border-radius: var(--radius-lg);
  overflow: hidden;
}
.card-header {
  padding: .85rem 1.25rem; font-weight: 700; font-size: .88rem; letter-spacing: .3px;
  border-bottom: 1px solid var(--glass-bd); color: var(--text);
}
.card-header.gold  { background: rgba(240,180,41,.1);  color: var(--gold); }
.card-header.blue  { background: rgba(26,108,245,.13); color: var(--blue-light); }
.card-header.green { background: rgba(52,211,153,.09); color: var(--green); }
.card-header.dark  { background: rgba(255,255,255,.04); }
.card-body { padding: 1.25rem; }

/* ── Section Title ──────────────────────────────────────────────────────────── */
.section-title { font-size: 1.5rem; font-weight: 800; color: var(--text); margin-bottom: 1.25rem; letter-spacing: -.3px; }
.section-title small { font-size: .88rem; font-weight: 500; color: var(--text-dim); }

/* ── Stat Pills ─────────────────────────────────────────────────────────────── */
.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: .75rem; margin-bottom: 1.5rem; }
.stat-pill {
  background: var(--glass);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--glass-bd); border-radius: var(--radius-lg);
  padding: 1.1rem .75rem; text-align: center;
  transition: transform .2s, background .2s;
}
.stat-pill:hover { background: var(--glass-md); transform: translateY(-2px); }
.stat-pill .val { font-size: 2rem; font-weight: 900; color: var(--text); line-height: 1; letter-spacing: -1px; }
.stat-pill .lbl { font-size: .67rem; color: var(--text-dim); margin-top: .3rem; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; }
.stat-pill.gold  .val { color: var(--gold); }
.stat-pill.green .val { color: var(--green); }
.stat-pill.blue  .val { color: var(--blue-light); }
.stat-pill.red   .val { color: var(--red); }

/* ── Tables ─────────────────────────────────────────────────────────────────── */
.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { width: 100%; border-collapse: collapse; font-size: .875rem; }
thead th {
  padding: .75rem .85rem; text-align: center;
  font-size: .7rem; font-weight: 700; letter-spacing: .8px; text-transform: uppercase;
  color: var(--text-dim); border-bottom: 1px solid var(--glass-bd);
  white-space: nowrap; background: transparent;
}
thead th:first-child { text-align: left; padding-left: 1.25rem; }
tbody tr { border-bottom: 1px solid rgba(255,255,255,.04); transition: background .15s; }
tbody tr:hover { background: var(--glass); }
tbody tr:last-child { border-bottom: none; }
tbody tr.row-gold   { background: rgba(240,180,41,.07); }
tbody tr.row-silver { background: rgba(255,255,255,.03); }
tbody tr.row-bronze { background: rgba(255,120,60,.04); }
tbody td { padding: .62rem .85rem; text-align: center; color: var(--text); }
tbody td:first-child { text-align: left; padding-left: 1.25rem; }
.pts-val  { font-weight: 800; color: var(--gold); }
.gols-val { font-weight: 700; color: var(--green); }
.nome-cell { font-weight: 600; }

.badge-v { background: rgba(52,211,153,.14); color: var(--green); padding: .18rem .55rem; border-radius: 6px; font-weight: 700; font-size: .8rem; display: inline-block; }
.badge-d { background: rgba(248,113,113,.14); color: var(--red); padding: .18rem .55rem; border-radius: 6px; font-weight: 700; font-size: .8rem; display: inline-block; }
.badge-e { background: rgba(251,191,36,.14); color: var(--amber); padding: .18rem .55rem; border-radius: 6px; font-weight: 700; font-size: .8rem; display: inline-block; }

/* ── Tags ───────────────────────────────────────────────────────────────────── */
.tag { display: inline-block; padding: .2rem .65rem; border-radius: 6px; font-size: .72rem; font-weight: 700; letter-spacing: .3px; }
.tag-azul   { background: rgba(26,108,245,.2);  color: var(--blue-light); }
.tag-preto  { background: rgba(255,255,255,.1);  color: rgba(255,255,255,.82); }
.tag-empate { background: rgba(251,191,36,.15);  color: var(--amber); }

/* ── Round Cards ────────────────────────────────────────────────────────────── */
.rounds-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem; }
.round-card {
  background: var(--glass);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--glass-bd); border-radius: var(--radius-lg);
  overflow: hidden; cursor: pointer;
  transition: transform .22s, background .2s, box-shadow .22s;
}
.round-card:hover { transform: translateY(-3px); background: var(--glass-md); box-shadow: 0 14px 44px rgba(0,0,0,.32); }
.round-header { padding: .65rem 1rem; display: flex; justify-content: space-between; align-items: center; font-size: .77rem; font-weight: 700; letter-spacing: .3px; }
.rh-azul   { background: rgba(26,108,245,.18); color: var(--blue-light); }
.rh-preto  { background: rgba(255,255,255,.07); color: var(--text); }
.rh-empate { background: rgba(251,191,36,.12);  color: var(--amber); }
.round-score { padding: 1rem; display: flex; align-items: center; justify-content: center; gap: 1rem; }
.team-score { text-align: center; }
.team-name-label { font-size: .65rem; font-weight: 800; letter-spacing: 1.5px; color: var(--text-faint); text-transform: uppercase; }
.score-num { font-size: 2.5rem; font-weight: 900; line-height: 1; color: var(--text); }
.score-num.winner { color: var(--gold); }
.score-divider { font-size: 1.3rem; color: var(--text-faint); }
.round-footer { padding: .5rem 1rem .75rem; font-size: .77rem; color: var(--text-dim); border-top: 1px solid var(--glass-bd); }
.scorers-line { display: flex; flex-wrap: wrap; gap: .3rem; margin-top: .3rem; }
.scorer-tag { background: rgba(52,211,153,.11); color: var(--green); padding: .2rem .55rem; border-radius: 10px; font-size: .72rem; font-weight: 600; }

/* ── Round Detail ───────────────────────────────────────────────────────────── */
.round-detail-hero {
  background: rgba(8,18,44,.65);
  backdrop-filter: blur(26px); -webkit-backdrop-filter: blur(26px);
  border: 1px solid var(--glass-bd); border-radius: var(--radius-lg);
  padding: 2.5rem 2rem; text-align: center; margin-bottom: 1.5rem;
  position: relative; overflow: hidden;
}
.round-detail-hero::before { content: '⚽'; position: absolute; font-size: 10rem; opacity: .025; top: -1.5rem; right: -1.5rem; pointer-events: none; }
.rnd-date  { font-size: .82rem; color: var(--text-dim); margin-bottom: .5rem; letter-spacing: 1px; }
.rnd-title { font-size: .88rem; font-weight: 800; color: var(--gold); margin-bottom: 1.5rem; letter-spacing: 2px; }
.rnd-scoreboard { display: flex; align-items: center; justify-content: center; gap: 2rem; }
.rnd-team { text-align: center; }
.rnd-team-name { font-size: .7rem; font-weight: 800; letter-spacing: 2px; opacity: .55; text-transform: uppercase; }
.rnd-score { font-size: 5rem; font-weight: 900; line-height: 1; color: var(--text); }
.rnd-score.winner { color: var(--gold); }
.rnd-x { font-size: 2rem; opacity: .28; }
.rnd-result-badge { display: inline-block; margin-top: 1.25rem; padding: .4rem 1.1rem; border-radius: 40px; font-size: .8rem; font-weight: 700; letter-spacing: .5px; }
.rnd-result-badge.azul   { background: rgba(26,108,245,.22); color: var(--blue-light); border: 1px solid rgba(26,108,245,.28); }
.rnd-result-badge.preto  { background: rgba(255,255,255,.1);  color: var(--text); border: 1px solid var(--glass-bd); }
.rnd-result-badge.empate { background: rgba(251,191,36,.14);  color: var(--amber); border: 1px solid rgba(251,191,36,.28); }

/* ── Lineups ────────────────────────────────────────────────────────────────── */
.lineups { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.5rem; }
.lineup-card {
  background: var(--glass);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--glass-bd); border-radius: var(--radius-lg); overflow: hidden;
}
.lineup-title { padding: .7rem 1rem; font-weight: 700; font-size: .83rem; letter-spacing: .5px; text-transform: uppercase; }
.lineup-title.preto { background: rgba(255,255,255,.06); color: var(--text); }
.lineup-title.azul  { background: rgba(26,108,245,.18);  color: var(--blue-light); }
.lineup-list { list-style: none; padding: .5rem 0; }
.lineup-list li { padding: .42rem 1rem; font-size: .875rem; display: flex; align-items: center; gap: .5rem; border-bottom: 1px solid rgba(255,255,255,.04); color: var(--text); }
.lineup-list li:last-child { border-bottom: none; }

/* ── Player Profile ─────────────────────────────────────────────────────────── */
.player-hero {
  background: rgba(8,18,44,.65);
  backdrop-filter: blur(26px); -webkit-backdrop-filter: blur(26px);
  border: 1px solid var(--glass-bd); border-radius: var(--radius-lg);
  padding: 2rem 1.75rem; margin-bottom: 1.5rem;
  display: flex; align-items: center; gap: 1.5rem;
}
.player-avatar {
  width: 80px; height: 80px; border-radius: 50%;
  background: rgba(240,180,41,.14); border: 2px solid rgba(240,180,41,.32);
  display: flex; align-items: center; justify-content: center;
  font-size: 2rem; font-weight: 900; color: var(--gold); flex-shrink: 0;
}
.player-info h1 { font-size: 1.6rem; font-weight: 900; color: var(--text); }
.player-apelido { font-size: .9rem; color: var(--text-dim); margin-top: .15rem; }
.player-meta { font-size: .8rem; color: var(--text-faint); margin-top: .25rem; }
.seasons-tabs { display: flex; gap: .5rem; margin-bottom: 1rem; }
.season-tab { padding: .45rem 1rem; border-radius: 40px; border: 1px solid var(--glass-bd); background: var(--glass); font-weight: 700; font-size: .85rem; color: var(--text-dim); transition: all .2s; cursor: pointer; }
.season-tab.active { background: rgba(240,180,41,.14); color: var(--gold); border-color: rgba(240,180,41,.38); }

/* ── Tabs ───────────────────────────────────────────────────────────────────── */
.tabs { display: flex; gap: .25rem; border-bottom: 1px solid var(--glass-bd); margin-bottom: 1.25rem; overflow-x: auto; }
.tab-btn { padding: .6rem 1rem; background: none; border: none; font-weight: 600; font-size: .875rem; color: var(--text-dim); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; transition: all .2s; }
.tab-btn.active { color: var(--gold); border-bottom-color: var(--gold); }
.tab-content { display: none; }
.tab-content.active { display: block; }

/* ── Search ─────────────────────────────────────────────────────────────────── */
.search-box {
  width: 100%; padding: .75rem 1.25rem; border: 1px solid var(--glass-bd); border-radius: var(--radius-pill);
  font-size: .9rem; margin-bottom: 1.25rem; outline: none;
  background: var(--glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  color: var(--text); transition: border .2s, background .2s;
}
.search-box::placeholder { color: var(--text-faint); }
.search-box:focus { border-color: rgba(240,180,41,.45); background: var(--glass-md); }

/* ── Back Button ────────────────────────────────────────────────────────────── */
.back-btn {
  display: inline-flex; align-items: center; gap: .4rem;
  color: var(--text-dim); font-weight: 600; margin-bottom: 1.25rem;
  font-size: .875rem; background: var(--glass); border: 1px solid var(--glass-bd);
  padding: .5rem 1rem; border-radius: var(--radius-pill); transition: all .2s;
}
.back-btn:hover { background: var(--glass-md); color: var(--text); }

/* ── Loading — Bouncing Ball ────────────────────────────────────────────────── */
.loading-container { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 55vh; gap: 0; }
.loading-ball { font-size: 3.5rem; display: inline-block; animation: ballBounce .72s cubic-bezier(.36,.07,.19,.97) infinite; filter: drop-shadow(0 14px 8px rgba(0,0,0,.45)); }
.loading-shadow { width: 38px; height: 10px; background: rgba(0,0,0,.3); border-radius: 50%; margin-top: 4px; animation: shadowPulse .72s cubic-bezier(.36,.07,.19,.97) infinite; }
.loading-text { color: var(--text-dim); font-size: .88rem; font-weight: 600; letter-spacing: .5px; margin-top: 1.5rem; }

@keyframes ballBounce {
  0%   { transform: translateY(0) scaleX(1)    scaleY(1); }
  40%  { transform: translateY(-52px) scaleX(1) scaleY(1); }
  50%  { transform: translateY(-52px) scaleX(1.06) scaleY(.94); }
  60%  { transform: translateY(-52px) scaleX(1) scaleY(1); }
  92%  { transform: translateY(0) scaleX(1.1)  scaleY(.9); }
  100% { transform: translateY(0) scaleX(1)    scaleY(1); }
}
@keyframes shadowPulse {
  0%,100% { transform: scale(1);   opacity: .35; }
  50%      { transform: scale(.45); opacity: .1; }
}

/* ── Gallery ────────────────────────────────────────────────────────────────── */
.gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 1rem; margin-top: 1.5rem; }
.gallery-slot { aspect-ratio: 1; background: var(--glass); border: 1px dashed rgba(255,255,255,.15); border-radius: var(--radius); display: flex; align-items: center; justify-content: center; color: var(--text-faint); font-size: 1.75rem; transition: background .2s; }
.gallery-slot:hover { background: var(--glass-md); }

/* ── Artilharia Bar ─────────────────────────────────────────────────────────── */
.art-bar-bg { flex: 1; background: rgba(255,255,255,.06); border-radius: 4px; height: 6px; overflow: hidden; min-width: 60px; }
.art-bar-fill { height: 100%; border-radius: 4px; background: var(--green); transition: width .4s ease; }
.art-bar-fill.gc { background: var(--text-faint); }

/* ── Misc ───────────────────────────────────────────────────────────────────── */
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
.empty-state { text-align: center; padding: 4rem 1rem; color: var(--text-dim); }
.empty-icon { font-size: 3rem; margin-bottom: .75rem; }
.reconstituida-badge { background: rgba(240,180,41,.14); color: var(--gold); font-size: .67rem; padding: .1rem .4rem; border-radius: 4px; font-weight: 600; }
.art-clickable { cursor: pointer; border-radius: 10px; transition: background .15s; }
.art-clickable:hover { background: var(--glass); }

/* ── Responsive ─────────────────────────────────────────────────────────────── */
@media (max-width: 700px) {
  .grid-2, .lineups { grid-template-columns: 1fr; }
  .rounds-grid { grid-template-columns: 1fr; }
  .player-hero { flex-direction: column; text-align: center; }
  .rnd-score { font-size: 3.5rem; }
  #main-nav { top: 60px; max-width: calc(100vw - 24px); overflow-x: auto; }
  .nav-btn { padding: 8px 10px; font-size: .73rem; }
  main { padding-top: 130px; }
  #season-wrapper { top: 12px; left: 10px; }
  .section-title { font-size: 1.25rem; }
}
</style>
</head>
<body>

<div class="bg-orbs">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
</div>

<div id="app">

  <!-- Season Selector — top left -->
  <div id="season-wrapper">
    <button class="season-toggle-btn" id="season-toggle-btn" onclick="toggleSeasonDropdown()">
      <span id="season-label">2026</span>
      <svg width="10" height="6" viewBox="0 0 10 6" fill="none">
        <path d="M1 1L5 5L9 1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <div id="season-dropdown"></div>
  </div>

  <!-- Floating Nav -->
  <nav id="main-nav">
    <button class="nav-btn active" onclick="navigate('home')" data-page="home">Início</button>
    <button class="nav-btn" onclick="navigate('classificacao')" data-page="classificacao">Classificação</button>
    <button class="nav-btn" onclick="navigate('artilharia')" data-page="artilharia">Artilharia</button>
    <button class="nav-btn" onclick="navigate('rodadas')" data-page="rodadas">Rodadas</button>
    <button class="nav-btn" onclick="navigate('jogadores')" data-page="jogadores">Jogadores</button>
    <button class="nav-btn" onclick="navigate('galeria')" data-page="galeria">Galeria</button>
  </nav>

  <main id="main-content">
    <div class="loading-container">
      <div class="loading-ball">⚽</div>
      <div class="loading-shadow"></div>
      <div class="loading-text">Carregando dados...</div>
    </div>
  </main>

  <footer>
    <strong style="color:rgba(255,255,255,.65);">PSOT</strong>
    <span> — Pelada de Sábado Oito e Trinta · Clube Álvares Cabral, Vitória/ES</span>
    <span id="footer-updated" style="margin-left:.5rem;"></span>
  </footer>

</div>

<script>
// ── State ────────────────────────────────────────────────────────────────────
const state = {
  currentPage: 'home',
  currentSeason: '2026',
  seasons: {},
  config: null,
  dropdownOpen: false,
};

// ── Season Dropdown ───────────────────────────────────────────────────────────
function toggleSeasonDropdown() {
  state.dropdownOpen = !state.dropdownOpen;
  const dd  = document.getElementById('season-dropdown');
  const btn = document.getElementById('season-toggle-btn');
  if (state.dropdownOpen) { dd.classList.add('open'); btn.classList.add('open'); }
  else { dd.classList.remove('open'); btn.classList.remove('open'); }
}

function closeSeasonDropdown() {
  state.dropdownOpen = false;
  document.getElementById('season-dropdown').classList.remove('open');
  document.getElementById('season-toggle-btn').classList.remove('open');
}

document.addEventListener('click', e => {
  const w = document.getElementById('season-wrapper');
  if (w && !w.contains(e.target)) closeSeasonDropdown();
});

function buildSeasonSelector() {
  document.getElementById('season-label').textContent = state.currentSeason;
  const dd = document.getElementById('season-dropdown');
  dd.innerHTML = state.config.seasons.map(s => `
    <button class="season-option ${s === state.currentSeason ? 'active' : ''}" onclick="setSeason('${s}')">
      <span class="dot"></span>
      ${s}
      ${s === state.config.current_season ? '<span class="cur-tag">atual</span>' : ''}
    </button>`).join('');
}

function setSeason(s) {
  state.currentSeason = s;
  closeSeasonDropdown();
  buildSeasonSelector();
  navigate(state.currentPage);
}

function getSeason() { return state.seasons[state.currentSeason]; }

// ── Data Loading ──────────────────────────────────────────────────────────────
async function loadData() {
  const [cfg, s2025, s2026] = await Promise.all([
    fetch('data/config.json').then(r => r.json()),
    fetch('data/2025.json').then(r => r.json()),
    fetch('data/2026.json').then(r => r.json()),
  ]);
  state.config = cfg;
  state.seasons['2025'] = s2025;
  state.seasons['2026'] = s2026;
  state.currentSeason = cfg.current_season;
  document.getElementById('footer-updated').textContent = `Atualizado em ${cfg.updated}`;
  buildSeasonSelector();
  navigate(state.currentPage);
}

// ── Router ────────────────────────────────────────────────────────────────────
function navigate(page, params = {}) {
  state.currentPage = page.split(':')[0];
  document.querySelectorAll('#main-nav .nav-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.page === state.currentPage);
  });
  const el = document.getElementById('main-content');
  switch (state.currentPage) {
    case 'home':          el.innerHTML = renderHome();                              break;
    case 'classificacao': el.innerHTML = renderClassificacao();                    break;
    case 'artilharia':   el.innerHTML = renderArtilharia();                       break;
    case 'rodadas':      el.innerHTML = renderRodadas();                          break;
    case 'rodada':       el.innerHTML = renderRodadaDetail(params.num);           break;
    case 'jogadores':    el.innerHTML = renderJogadores();                        break;
    case 'jogador':      el.innerHTML = renderJogadorDetail(params.apelido, params.season); break;
    case 'galeria':      el.innerHTML = renderGaleria();                          break;
  }
  window.scrollTo(0, 0);
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function fmtDate(d) {
  if (!d) return '';
  const [dd, mm, yyyy] = d.split('.');
  const months = ['','Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  return `${parseInt(dd)} ${months[parseInt(mm)]} ${yyyy}`;
}

function vencTag(v) {
  if (!v) return '';
  if (v === 'AZUL')  return `<span class="tag tag-azul">Azul Vence</span>`;
  if (v === 'PRETO') return `<span class="tag tag-preto">Preto Vence</span>`;
  return `<span class="tag tag-empate">Empate</span>`;
}

function medalPos(p) {
  if (p === 1) return '🥇';
  if (p === 2) return '🥈';
  if (p === 3) return '🥉';
  return p;
}

function rowClass(p) {
  if (p === 1) return 'row-gold';
  if (p === 2) return 'row-silver';
  if (p === 3) return 'row-bronze';
  return '';
}

function pct(v, j) { return j > 0 ? Math.round(v / j * 100) + '%' : '—'; }
function pts(p) { return (p.vitorias || 0) * 3 + (p.empates || 0); }

function allPlayers() {
  const seen = {};
  ['2025','2026'].forEach(yr => {
    const s = state.seasons[yr];
    if (!s) return;
    s.players.forEach(p => {
      const key = p.apelido.toUpperCase();
      if (!seen[key]) seen[key] = { apelido: p.apelido, nome: p.nome, seasons: {} };
      seen[key].seasons[yr] = p;
    });
  });
  return Object.values(seen);
}

function scorersText(gols) {
  if (!gols || !Object.keys(gols).length) return '';
  return Object.entries(gols)
    .filter(([, g]) => g > 0)
    .sort(([, a], [, b]) => b - a)
    .map(([n, g]) => g > 1 ? `${n} (${g})` : n)
    .join(', ');
}

// ── Btn util ──────────────────────────────────────────────────────────────────
function ghostBtn(label, onclick) {
  return `<button onclick="${onclick}" style="background:var(--glass-md);border:1px solid var(--glass-bd);color:var(--text-dim);padding:.5rem 1.1rem;border-radius:40px;font-size:.8rem;font-weight:600;transition:all .2s;" onmouseover="this.style.color='var(--text)';this.style.background='var(--glass-hi)'" onmouseout="this.style.color='var(--text-dim)';this.style.background='var(--glass-md)'">${label}</button>`;
}

// ── Home ──────────────────────────────────────────────────────────────────────
function renderHome() {
  const s = getSeason();
  const st = s.stats;
  const top3art = s.artilharia.slice(0, 3);
  const lastRound = s.rounds[s.rounds.length - 1];
  const top5class = [...s.players]
    .filter(p => p.jogos > 0)
    .sort((a, b) => pts(b) - pts(a) || b.gols - a.gols)
    .slice(0, 5);

  return `
  <div class="section-title">Temporada ${state.currentSeason}</div>

  <div class="stat-grid">
    <div class="stat-pill"><div class="val">${s.total_rodadas}</div><div class="lbl">Rodadas</div></div>
    <div class="stat-pill green"><div class="val">${st.total_gols}</div><div class="lbl">Gols</div></div>
    <div class="stat-pill gold"><div class="val">${st.media_gols}</div><div class="lbl">Média/Jogo</div></div>
    <div class="stat-pill"><div class="val">${s.players.filter(p=>p.jogos>0).length}</div><div class="lbl">Jogadores</div></div>
    <div class="stat-pill blue"><div class="val">${st.vitoria_azul}</div><div class="lbl">Vitórias Azul</div></div>
    <div class="stat-pill"><div class="val">${st.vitoria_preto}</div><div class="lbl">Vitórias Preto</div></div>
    <div class="stat-pill gold"><div class="val">${st.empates}</div><div class="lbl">Empates</div></div>
  </div>

  <div class="grid-2" style="margin-bottom:1rem;">
    <div class="card">
      <div class="card-header dark">Última Rodada · R${lastRound?.rodada || '—'}</div>
      <div class="card-body">
        ${lastRound ? `
          <div style="text-align:center;padding:.25rem 0;">
            <div style="font-size:.78rem;color:var(--text-dim);margin-bottom:.75rem;">${fmtDate(lastRound.data)}</div>
            <div style="display:flex;align-items:center;justify-content:center;gap:1.5rem;margin-bottom:.75rem;">
              <div style="text-align:center;">
                <div style="font-size:.63rem;font-weight:800;letter-spacing:1.5px;color:var(--text-faint);">PRETO</div>
                <div style="font-size:3.5rem;font-weight:900;color:var(--text);line-height:1.1;">${lastRound.placar_final[0]}</div>
              </div>
              <div style="font-size:1.4rem;color:var(--text-faint);">×</div>
              <div style="text-align:center;">
                <div style="font-size:.63rem;font-weight:800;letter-spacing:1.5px;color:var(--blue-light);">AZUL</div>
                <div style="font-size:3.5rem;font-weight:900;color:var(--blue-light);line-height:1.1;">${lastRound.placar_final[1]}</div>
              </div>
            </div>
            ${vencTag(lastRound.vencedor)}
          </div>
          ${Object.keys(lastRound.gols||{}).length ? `
            <div style="margin-top:.75rem;padding-top:.75rem;border-top:1px solid var(--glass-bd);">
              <div style="font-size:.68rem;font-weight:700;color:var(--text-dim);margin-bottom:.35rem;text-transform:uppercase;letter-spacing:.5px;">Gols</div>
              <div class="scorers-line">
                ${Object.entries(lastRound.gols||{}).filter(([,g])=>g>0).sort(([,a],[,b])=>b-a).map(([n,g])=>`<span class="scorer-tag">${n}${g>1?' ('+g+')':''}</span>`).join('')}
              </div>
            </div>` : ''}
          <div style="margin-top:.85rem;text-align:center;">
            ${ghostBtn('Ver detalhes →', `navigate('rodada',{num:${lastRound.rodada}})`)}
          </div>
        ` : '<div class="empty-state"><div class="empty-icon">📅</div>Sem rodadas ainda</div>'}
      </div>
    </div>

    <div class="card">
      <div class="card-header green">Top Artilheiros</div>
      <div class="card-body" style="padding-top:.75rem;">
        ${top3art.map((a, i) => `
          <div class="art-clickable" style="display:flex;align-items:center;gap:.75rem;padding:.65rem .35rem;border-bottom:1px solid rgba(255,255,255,.04);" onclick="navigate('jogador',{apelido:'${escAp(a.apelido)}',season:'${state.currentSeason}'})">
            <div style="width:30px;text-align:center;font-size:.85rem;">${medalPos(i+1)}</div>
            <div style="flex:1;font-weight:600;">${a.apelido}</div>
            <div class="art-bar-bg"><div class="art-bar-fill" style="width:${Math.round(a.gols/top3art[0].gols*100)}%;"></div></div>
            <div style="font-weight:800;color:var(--green);min-width:26px;text-align:right;">${a.gols}</div>
          </div>
        `).join('')}
        <div style="text-align:center;margin-top:.85rem;">
          ${ghostBtn('Ver tabela completa →', "navigate('artilharia')")}
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-header blue">Classificação — Top 5</div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>#</th><th>Jogador</th><th>J</th><th>V</th><th>E</th><th>D</th><th>PTS</th><th>Gols</th></tr></thead>
        <tbody>
          ${top5class.map((p, i) => `
            <tr class="${rowClass(i+1)}" style="cursor:pointer;" onclick="navigate('jogador',{apelido:'${escAp(p.apelido)}',season:'${state.currentSeason}'})">
              <td>${medalPos(i+1)}</td>
              <td class="nome-cell">${p.apelido}</td>
              <td>${p.jogos}</td>
              <td><span class="badge-v">${p.vitorias}</span></td>
              <td>${p.empates ?? 0}</td>
              <td>${p.derrotas ?? 0}</td>
              <td class="pts-val">${pts(p)}</td>
              <td class="gols-val">${p.gols}</td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>
    <div style="padding:.75rem 1.25rem;text-align:center;">
      ${ghostBtn('Ver classificação completa →', "navigate('classificacao')")}
    </div>
  </div>`;
}

// ── Classificação ─────────────────────────────────────────────────────────────
function renderClassificacao() {
  const s = getSeason();
  const totalRodadas = s.total_rodadas;
  const minJogos = Math.floor(totalRodadas / 2);

  const ativos = [...s.players].filter(p => p.jogos > 0)
    .sort((a, b) => pts(b) - pts(a) || b.gols - a.gols || a.apelido.localeCompare(b.apelido));

  const elegiveis = ativos.filter(p => p.jogos >= minJogos);
  const inativos  = ativos.filter(p => p.jogos < minJogos);

  const tabela = (lista, startPos = 1) => lista.map((p, i) => {
    const pos = startPos + i;
    const pv = pct(p.vitorias, p.jogos);
    return `<tr class="${rowClass(pos)}" style="cursor:pointer;" onclick="navigate('jogador',{apelido:'${escAp(p.apelido)}',season:'${state.currentSeason}'})">
      <td>${medalPos(pos)}</td>
      <td class="nome-cell">${p.apelido}</td>
      <td>${p.jogos}/${totalRodadas}</td>
      <td><span class="badge-v">${p.vitorias}</span></td>
      <td>${p.empates ?? 0}</td>
      <td>${p.derrotas ?? 0}</td>
      <td class="pts-val">${pts(p)}</td>
      <td class="gols-val">${p.gols}</td>
      <td style="color:var(--text-dim);">${pv}</td>
    </tr>`;
  }).join('');

  return `
  <div class="section-title">Classificação ${state.currentSeason}</div>
  <div class="tabs">
    <button class="tab-btn active" onclick="showTab('tab-geral',this)">Geral</button>
    <button class="tab-btn" onclick="showTab('tab-pct',this)">% Vitórias <span style="background:var(--gold-dim);color:var(--gold);font-size:.68rem;padding:.1rem .38rem;border-radius:4px;margin-left:.3rem;">mín ${minJogos}j</span></button>
  </div>

  <div id="tab-geral" class="tab-content active">
    <div class="card">
      <div class="table-wrap">
        <table>
          <thead><tr><th>#</th><th>Jogador</th><th>J</th><th>V</th><th>E</th><th>D</th><th>PTS</th><th>Gols</th><th>%Vit</th></tr></thead>
          <tbody>${tabela(ativos)}</tbody>
        </table>
      </div>
    </div>
    <p style="font-size:.74rem;color:var(--text-faint);margin-top:.5rem;padding-left:.25rem;">PTS = Vitórias×3 + Empates×1</p>
  </div>

  <div id="tab-pct" class="tab-content">
    ${(() => {
      const rankPct = elegiveis.sort((a,b) =>
        (b.vitorias/b.jogos - a.vitorias/a.jogos) || pts(b)-pts(a) || b.gols-a.gols
      );
      return `
      <div class="card">
        <div class="table-wrap">
          <table>
            <thead><tr><th>#</th><th>Jogador</th><th>J</th><th>V</th><th>E</th><th>D</th><th>PTS</th><th>Gols</th><th>%Vit</th></tr></thead>
            <tbody>${tabela(rankPct)}</tbody>
          </table>
        </div>
      </div>
      ${inativos.length ? `
      <div style="margin-top:1rem;" class="card">
        <div class="card-header" style="background:rgba(240,180,41,.07);color:var(--amber);">Amostra insuficiente — menos de ${minJogos} jogos</div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>#</th><th>Jogador</th><th>J</th><th>V</th><th>E</th><th>D</th><th>Gols</th><th>%Vit</th></tr></thead>
            <tbody>${inativos.map((p) => `<tr style="opacity:.5;cursor:pointer;" onclick="navigate('jogador',{apelido:'${escAp(p.apelido)}',season:'${state.currentSeason}'})">
              <td>—</td><td>${p.apelido}</td><td>${p.jogos}</td><td>${p.vitorias}</td><td>${p.empates??0}</td><td>${p.derrotas??0}</td><td>${p.gols}</td><td>${pct(p.vitorias,p.jogos)}</td></tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>` : ''}
      <p style="font-size:.74rem;color:var(--text-faint);margin-top:.5rem;padding-left:.25rem;">Mínimo de ${minJogos} jogos (⌊${totalRodadas}÷2⌋) para entrar no ranking por %</p>`;
    })()}
  </div>`;
}

// ── Artilharia ────────────────────────────────────────────────────────────────
function renderArtilharia() {
  const s = getSeason();
  const art = s.artilharia;
  const max = art[0]?.gols || 1;
  return `
  <div class="section-title">Artilharia ${state.currentSeason}</div>
  <div class="card">
    <div class="card-body" style="padding-top:.5rem;">
      ${art.map((a, i) => {
        const isGC = a.apelido.toUpperCase().includes('GOL CONTRA') || a.apelido.toUpperCase().includes('GC');
        return `
        <div class="${!isGC ? 'art-clickable' : ''}" style="display:flex;align-items:center;gap:.75rem;padding:.7rem .25rem;border-bottom:1px solid rgba(255,255,255,.04);" ${!isGC ? `onclick="navigate('jogador',{apelido:'${escAp(a.apelido)}',season:'${state.currentSeason}'})"` : ''}>
          <div style="width:32px;text-align:center;font-weight:700;">${isGC ? '—' : medalPos(i+1)}</div>
          <div style="flex:1;font-weight:${i<3?'700':'600'};color:${isGC?'var(--text-faint)':'var(--text)'};">${a.apelido}</div>
          <div class="art-bar-bg"><div class="art-bar-fill ${isGC?'gc':''}" style="width:${Math.round(a.gols/max*100)}%;"></div></div>
          <div style="font-weight:800;color:${isGC?'var(--text-faint)':'var(--green)'};min-width:32px;text-align:right;font-size:1rem;">${a.gols}</div>
        </div>`;
      }).join('')}
    </div>
  </div>`;
}

// ── Rodadas ───────────────────────────────────────────────────────────────────
function renderRodadas() {
  const s = getSeason();
  const rounds = [...s.rounds].reverse();
  return `
  <div class="section-title">Rodadas ${state.currentSeason} <small>${s.total_rodadas} disputadas</small></div>
  <div class="rounds-grid">
    ${rounds.map(r => {
      const pf = r.placar_final;
      const v = r.vencedor || (pf ? (pf[0]>pf[1]?'PRETO':pf[1]>pf[0]?'AZUL':'EMPATE') : 'EMPATE');
      const hdrClass = v === 'AZUL' ? 'rh-azul' : v === 'PRETO' ? 'rh-preto' : 'rh-empate';
      const scorers = scorersText(r.gols);
      return `
      <div class="round-card" onclick="navigate('rodada',{num:${r.rodada}})">
        <div class="round-header ${hdrClass}">
          <span>Rodada ${r.rodada}</span>
          <span>${fmtDate(r.data)}</span>
          ${r.reconstituida ? '<span class="reconstituida-badge">reconstituída</span>' : ''}
        </div>
        <div class="round-score">
          <div class="team-score">
            <div class="team-name-label">PRETO</div>
            <div class="score-num ${v==='PRETO'?'winner':''}">${pf?pf[0]:'?'}</div>
          </div>
          <div class="score-divider">×</div>
          <div class="team-score">
            <div class="team-name-label" style="color:var(--blue-light);">AZUL</div>
            <div class="score-num ${v==='AZUL'?'winner':''}" style="${v!=='AZUL'?'color:var(--blue-light);':''}">${pf?pf[1]:'?'}</div>
          </div>
        </div>
        <div class="round-footer">
          <div>${vencTag(v)}</div>
          ${scorers ? `<div class="scorers-line" style="margin-top:.4rem;">${scorers.split(', ').map(s=>`<span class="scorer-tag">${s}</span>`).join('')}</div>` : ''}
        </div>
      </div>`;
    }).join('')}
  </div>`;
}

// ── Rodada Detail ─────────────────────────────────────────────────────────────
function renderRodadaDetail(num) {
  const s = getSeason();
  const r = s.rounds.find(x => x.rodada === num);
  if (!r) return `<button class="back-btn" onclick="navigate('rodadas')">← Voltar</button><div class="empty-state"><div class="empty-icon">❓</div>Rodada não encontrada</div>`;

  const pf = r.placar_final;
  const v = r.vencedor || (pf[0]>pf[1]?'PRETO':pf[1]>pf[0]?'AZUL':'EMPATE');
  const pretoWin = v === 'PRETO', azulWin = v === 'AZUL';

  const lineupHtml = (players, gols) => {
    if (!players?.length) return '<li style="padding:.5rem 1rem;color:var(--text-dim);font-size:.85rem;">Dados não disponíveis</li>';
    return players.map(p => {
      const g = gols?.[p] || 0;
      return `<li>${p}${g > 0 ? ` <span style="color:var(--green);font-size:.85rem;">${'⚽'.repeat(Math.min(g,5))}${g>1?' '+g+'g':''}</span>` : ''}</li>`;
    }).join('');
  };

  return `
  <button class="back-btn" onclick="navigate('rodadas')">← Rodadas</button>

  <div class="round-detail-hero">
    <div class="rnd-date">${fmtDate(r.data)}</div>
    <div class="rnd-title">RODADA ${r.rodada} · ${state.currentSeason}</div>
    <div class="rnd-scoreboard">
      <div class="rnd-team">
        <div class="rnd-team-name">PRETO</div>
        <div class="rnd-score ${pretoWin ? 'winner' : ''}">${pf[0]}</div>
      </div>
      <div class="rnd-x">×</div>
      <div class="rnd-team">
        <div class="rnd-team-name" style="color:var(--blue-light);">AZUL</div>
        <div class="rnd-score ${azulWin ? 'winner' : ''}" style="${!azulWin?'color:var(--blue-light);':''}">${pf[1]}</div>
      </div>
    </div>
    <div>
      <span class="rnd-result-badge ${v.toLowerCase()}">
        ${v === 'EMPATE' ? 'Empate' : `Vitória ${v === 'AZUL' ? 'Time Azul' : 'Time Preto'}`}
      </span>
      ${r.reconstituida ? '<span class="reconstituida-badge" style="margin-left:.5rem;">reconstituída</span>' : ''}
    </div>
    ${r.intervalo ? `<div style="margin-top:.75rem;font-size:.8rem;color:var(--text-faint);">Intervalo: ${r.intervalo[0]} × ${r.intervalo[1]}</div>` : ''}
  </div>

  ${Object.keys(r.gols||{}).length ? `
  <div class="card" style="margin-bottom:1rem;">
    <div class="card-header green">Marcadores</div>
    <div class="card-body">
      <div class="scorers-line">
        ${Object.entries(r.gols).filter(([,g])=>g>0).sort(([,a],[,b])=>b-a).map(([n,g])=>`<span class="scorer-tag" style="font-size:.85rem;padding:.3rem .75rem;">${n}${g>1?' ('+g+')':''}</span>`).join('')}
      </div>
      <div style="margin-top:.75rem;font-size:.8rem;color:var(--text-dim);">
        Total: ${Object.values(r.gols).reduce((a,b)=>a+b,0)} gols
      </div>
    </div>
  </div>` : ''}

  <div class="lineups">
    <div class="lineup-card">
      <div class="lineup-title preto">Time Preto ${pretoWin ? '🏆' : ''}</div>
      <ul class="lineup-list">${lineupHtml(r.time_preto, r.gols)}</ul>
    </div>
    <div class="lineup-card">
      <div class="lineup-title azul">Time Azul ${azulWin ? '🏆' : ''}</div>
      <ul class="lineup-list">${lineupHtml(r.time_azul, r.gols)}</ul>
    </div>
  </div>`;
}

// ── Jogadores ─────────────────────────────────────────────────────────────────
function renderJogadores() {
  const s = getSeason();
  const players = [...s.players].filter(p => p.jogos > 0)
    .sort((a, b) => a.apelido.localeCompare(b.apelido));

  return `
  <div class="section-title">Jogadores ${state.currentSeason}</div>
  <input class="search-box" id="player-search" placeholder="Buscar jogador..." oninput="filterPlayers()" />
  <div class="rounds-grid" id="players-grid">
    ${players.map(p => `
    <div class="round-card" onclick="navigate('jogador',{apelido:'${escAp(p.apelido)}',season:'${state.currentSeason}'})" data-name="${p.apelido.toLowerCase()}">
      <div class="round-header rh-preto">
        <span style="font-weight:700;">${p.apelido}</span>
        ${p.numero ? `<span style="background:var(--glass-md);padding:.15rem .5rem;border-radius:4px;font-size:.73rem;">#${p.numero}</span>` : ''}
      </div>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);text-align:center;padding:.9rem .5rem;">
        <div><div style="font-size:1.4rem;font-weight:900;color:var(--green);">${p.gols}</div><div style="font-size:.6rem;color:var(--text-dim);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-top:2px;">Gols</div></div>
        <div><div style="font-size:1.4rem;font-weight:900;color:var(--green);">${p.vitorias}</div><div style="font-size:.6rem;color:var(--text-dim);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-top:2px;">Vitórias</div></div>
        <div><div style="font-size:1.4rem;font-weight:900;color:var(--gold);">${pts(p)}</div><div style="font-size:.6rem;color:var(--text-dim);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-top:2px;">PTS</div></div>
        <div><div style="font-size:1.4rem;font-weight:900;color:var(--text-dim);">${p.jogos}</div><div style="font-size:.6rem;color:var(--text-dim);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-top:2px;">Jogos</div></div>
      </div>
    </div>`).join('')}
  </div>`;
}

function filterPlayers() {
  const q = document.getElementById('player-search').value.toLowerCase();
  document.querySelectorAll('#players-grid .round-card').forEach(el => {
    el.style.display = el.dataset.name.includes(q) ? '' : 'none';
  });
}

// ── Jogador Detail ────────────────────────────────────────────────────────────
function renderJogadorDetail(apelido, initSeason) {
  const decoded = decodeAp(apelido);
  const all = allPlayers();
  const found = all.find(p => p.apelido.toUpperCase() === decoded.toUpperCase());
  if (!found) return `<button class="back-btn" onclick="navigate('jogadores')">← Voltar</button><div class="empty-state"><div class="empty-icon">❓</div>Jogador não encontrado</div>`;

  const viewSeason = initSeason || state.currentSeason;
  const p = found.seasons[viewSeason];
  const initial = found.apelido.charAt(0).toUpperCase();
  const nome = found.nome || found.apelido;

  return `
  <button class="back-btn" onclick="navigate('jogadores')">← Jogadores</button>

  <div class="player-hero">
    <div class="player-avatar">${initial}</div>
    <div class="player-info">
      <h1>${found.apelido}</h1>
      <div class="player-apelido">${nome !== found.apelido ? nome : ''}</div>
      ${p?.data_nasc ? `<div class="player-meta">${p.data_nasc}</div>` : ''}
      ${p?.numero ? `<div class="player-meta">Camisa #${p.numero}</div>` : ''}
    </div>
  </div>

  <div class="seasons-tabs">
    ${Object.keys(found.seasons).map(yr => `
      <button class="season-tab ${yr === viewSeason ? 'active' : ''}"
        onclick="navigate('jogador',{apelido:'${escAp(found.apelido)}',season:'${yr}'})">${yr}</button>
    `).join('')}
  </div>

  ${p ? `
  <div class="stat-grid">
    <div class="stat-pill green"><div class="val">${p.gols??0}</div><div class="lbl">Gols</div></div>
    <div class="stat-pill"><div class="val">${p.jogos??0}</div><div class="lbl">Jogos</div></div>
    <div class="stat-pill green"><div class="val">${p.vitorias??0}</div><div class="lbl">Vitórias</div></div>
    <div class="stat-pill gold"><div class="val">${p.empates??0}</div><div class="lbl">Empates</div></div>
    <div class="stat-pill red"><div class="val">${p.derrotas??0}</div><div class="lbl">Derrotas</div></div>
    <div class="stat-pill gold"><div class="val">${pts(p)}</div><div class="lbl">PTS</div></div>
    <div class="stat-pill"><div class="val" style="font-size:1.4rem;">${pct(p.vitorias, p.jogos)}</div><div class="lbl">% Vitória</div></div>
    ${p.jogos>0?`<div class="stat-pill green"><div class="val" style="font-size:1.4rem;">${p.gols&&p.jogos?(p.gols/p.jogos).toFixed(2):'0.00'}</div><div class="lbl">Gols/Jogo</div></div>`:''}
  </div>

  <div class="card">
    <div class="card-header dark">Rodadas em ${viewSeason}</div>
    <div class="card-body">
      ${renderPlayerRounds(found.apelido, viewSeason)}
    </div>
  </div>
  ` : `<div class="empty-state"><div class="empty-icon">📅</div>Sem dados para ${viewSeason}</div>`}`;
}
