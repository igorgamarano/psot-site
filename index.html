function ghost(label,onclick,cls){return `<button class="ghost ${cls||''}" onclick="${onclick}">${label} <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>`;}

// ── CLASSIFICAÇÃO ─────────────────────────────────────────────────
function renderClassificacao(){
  const s=S();const tot=s.total_rodadas;const minJ=Math.floor(tot/2);
  const ativos=[...s.players].filter(p=>p.jogos>0&&!p.convidado).sort((a,b)=>pts(b)-pts(a)||b.gols-a.gols||a.apelido.localeCompare(b.apelido));
  const eleg=ativos.filter(p=>p.jogos>=minJ);const inel=ativos.filter(p=>p.jogos<minJ);
  const cart=p=>{const c=p.cartoes||{CA:0,CAz:0,CV:0};const t=(c.CA||0)+(c.CAz||0)+(c.CV||0);
    return t?`<td><span class="cart" data-tip="Amarelo ${c.CA||0} / Azul ${c.CAz||0} / Vermelho ${c.CV||0}">${t}</span></td>`:'<td style="color:var(--txt-3)">—</td>';};
  const rows=(list,showPos=true)=>list.map((p,i)=>{const pos=i+1;
    return `<tr class="clk ${showPos?rowCls(pos):''}" onclick="navigate('jogador',{apelido:'${escAp(p.apelido)}',season:'${state.season}'})">
      <td class="num">${showPos?medal(pos):'—'}</td>
      <td><div class="cell-name"><span class="mini">${initial(p.apelido)}${pAv(p.apelido)}</span>${p.apelido}</div></td>
      <td>${p.jogos}/${tot}</td><td><span class="b-v">${p.vitorias}</span></td><td>${p.empates||0}</td><td>${p.derrotas||0}</td>
      <td class="pts">${pts(p)}</td><td class="gv">${p.gols}</td>${cart(p)}<td style="color:var(--txt-2)">${pct(p.vitorias,p.jogos)}</td></tr>`;}).join('');
  const pctRows=[...eleg].sort((a,b)=>(b.vitorias/b.jogos-a.vitorias/a.jogos)||pts(b)-pts(a)||b.gols-a.gols);
  return `
  <div class="sec-head"><div class="ic">${I.trophy}</div><div><h2>Classificação</h2><small>Temporada ${state.season} · ${ativos.length} jogadores</small></div></div>
  <div class="tabs">
    <button class="tab-btn active" onclick="tab('t-geral',this)">Geral</button>
    <button class="tab-btn" onclick="tab('t-pct',this)">% Vitórias<span class="mini-tag">mín ${minJ}j</span></button>
  </div>
  <div id="t-geral" class="tab-content active">
    <div class="card"><div class="tw"><table>
      <thead><tr><th>#</th><th>Jogador</th><th>J</th><th>V</th><th>E</th><th>D</th><th>PTS</th><th>Gols</th><th>Cart</th><th>%V</th></tr></thead>
      <tbody>${rows(ativos)}</tbody></table></div></div>
    <p class="note">PTS = Vitórias×3 + Empates×1 · toque num jogador pra ver o perfil</p>
  </div>
  <div id="t-pct" class="tab-content">
    <div class="card"><div class="tw"><table>
      <thead><tr><th>#</th><th>Jogador</th><th>J</th><th>V</th><th>E</th><th>D</th><th>PTS</th><th>Gols</th><th>Cart</th><th>%V</th></tr></thead>
      <tbody>${rows(pctRows)}</tbody></table></div></div>
    ${inel.length?`<div class="card" style="margin-top:.9rem"><div class="card-h" style="background:rgba(251,191,36,.08);color:var(--amber)"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4 2.5 20h19z"/><path d="M12 10v4M12 17.4v.01"/></svg> Amostra insuficiente — menos de ${minJ} jogos</div>
      <div class="tw"><table><thead><tr><th>#</th><th>Jogador</th><th>J</th><th>V</th><th>E</th><th>D</th><th>PTS</th><th>Gols</th><th>Cart</th><th>%V</th></tr></thead>
      <tbody style="opacity:.6">${rows(inel,false)}</tbody></table></div></div>`:''}
    <p class="note">Mínimo de ${minJ} jogos (metade das ${tot} rodadas) para entrar no ranking por aproveitamento.</p>
  </div>`;
}

      <div class="t"><div class="tl">Preto</div><div class="ts ${v==='PRETO'?'win':''}">${pf[0]}</div></div>

    <div class="card-b"><div class="chips" style="justify-content:flex-start">${r.cartoes.map(c=>`<span class="chip" style="background:rgba(251,191,36,.12);color:var(--amber);border-color:rgba(251,191,36,.25)"><i class="ci ${c.tipo==='CV'?'cv':c.tipo==='CAz'?'caz':'ca'}"></i> ${c.jogador} <span class="g">(${c.time})</span></span>`).join('')}</div></div></div>`:''}
  <div class="lineups">
    <div class="lu"><div class="lu-h preto">Time Preto</div><ul>${lu(r.time_preto,r.gols)}</ul></div>

  </div>`;
}

function filterPlayers(){
  const q=document.getElementById('psearch').value.toLowerCase();let n=0;
  document.querySelectorAll('#pgrid .pcard').forEach(el=>{const ok=el.dataset.name.includes(q);el.style.display=ok?'':'none';if(ok)n++;});

}

function compressImg(file,max){return new Promise((res,rej)=>{const r=new FileReader();r.onload=ev=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas');let w=img.naturalWidth,h=img.naturalHeight;const k=Math.min(max/w,max/h,1);c.width=Math.round(w*k);c.height=Math.round(h*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',0.85));};img.onerror=rej;img.src=ev.target.result;};r.onerror=rej;r.readAsDataURL(file);});}

// ── ESCALAÇÃO (prancheta + histórico + pessoal) ─────────────────────────────
let escState={date:null,preto:[],azul:[],pel:[],editable:false,view:'atual',allDates:[],myList:[],currentId:null,titulo:'',present:[],showAbsent:false,halfOnly:[],away:[],swap:false,swapA:null,posOv:{},arte:'classico'};
let escDrag=null;
// ── presença / apelidos / formação ──
function escStrip(s){return (s==null?'':String(s)).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();}
const ESC_ALIAS={'lipeta':'lipin','marrequinho gaucho':'marreco','marrequinho':'marreco','fabricio siqueira':'fabricio','wagner':'dr wagner','mauro':'dr mauro','tiago primeiro':'primeiro','tiago':'primeiro','gabriel melo':'gabi melo','marcio augusto':'marcio','julio cesar':'julio','jhon':'jhonatas','gui':'giu','ze':'zeze'};
function escMatchId(name){
  let n=escStrip(name); if(!n) return null;
  if(ESC_ALIAS[n]) n=ESC_ALIAS[n];
  let hit=escState.pel.find(p=>escStrip(p.nome)===n);
  if(hit) return hit.id;
  const fw=n.split(' ')[0];
  hit=escState.pel.find(p=>{const pn=escStrip(p.nome);return pn===fw || pn.split(' ')[0]===fw && (pn.includes(n)||n.includes(pn));});
  return hit?hit.id:null;
}
function escParseLista(text){
  const lines=(text==null?'':String(text)).split(/\n/); let absent=false; const present=[]; const unknown=[]; const halfOnly=[]; const away=[];
  for(const raw of lines){
    const line=raw.trim(); if(!line) continue;
    const low=escStrip(line);
    if(low.indexOf('ausente')>=0){absent=true; continue;}
    if(absent){ const an=line.replace(/^\s*\d+\s*[-–.)]+\s*/,'').replace(/\([^)]*\)/g,'').replace(/[0-9]/g,'').trim(); const aid=escMatchId(an); if(aid&&away.indexOf(aid)<0) away.push(aid); continue; }
    if(/^(goleiro|corte|psot|linha|jogador|time preto|time azul|reserva)/.test(low)) continue;
    const isT1=/1\s*[°ºo]?\s*tempo|primeiro\s+tempo/i.test(line);
    let name=line.replace(/^\s*\d+\s*[-–.)]+\s*/,'').replace(/\([^)]*\)/g,'').replace(/[0-9]/g,'').trim();
    if(!escStrip(name)) continue;
    const id=escMatchId(name);
    if(id){ if(present.indexOf(id)<0) present.push(id); if(isT1&&halfOnly.indexOf(id)<0) halfOnly.push(id); }
    else { const c=name.replace(/[^A-Za-zÀ-ÿ ]/g,'').trim(); if(c) unknown.push(c); }
  }
  return {present:present, unknown:unknown, halfOnly:halfOnly, away:away};
}
function escAplicarLista(){
  const ta=document.getElementById('esc-lista'); if(!ta) return;
  const r=escParseLista(ta.value);
  escState.present=r.present;
  escState.halfOnly=r.halfOnly||[];
  escState.away=r.away||[];
  let msg=''+r.present.length+' presentes marcados.';
  if(escState.halfOnly.length) msg+='\nSó 1º tempo: '+escState.halfOnly.map(function(i){const p=pelById(i);return p?p.nome:i;}).join(', ');
  if(r.unknown.length) msg+='\n\nNão reconhecidos (confira ou trate como convidado):\n• '+r.unknown.join('\n• ');
  alert(msg);
  renderEscBoard();
}
function escSugerir(){
  if(!escState.editable) return;
  const hasPres=escState.present.length>0;
  let base;
  if(hasPres){ base=escState.present.map(function(id){return pelById(id);}).filter(Boolean).sort(function(a,b){return (a.ordem||999)-(b.ordem||999);}); }
  else { base=escState.pel.slice().sort(function(a,b){return (a.ordem||999)-(b.ordem||999);}); }
  const gks=base.filter(function(p){return (p.ordem||0)>=100;});
  const isen=base.filter(function(p){return (p.ordem||0)<100 && escIsento(p);});
  const line=base.filter(function(p){return (p.ordem||0)<100 && !escIsento(p);});
  if(!line.length){alert('Sem jogadores pra sugerir. Cole a lista primeiro.');return;}
  const perT=Math.min(ESC_MAX_LINE, Math.floor(line.length/2));
  if(!confirm('Montar '+perT+'+'+perT+' na linha (1 goleiro por time'+(isen.length?', + '+isen.map(function(p){return p.nome;}).join('/')+' que não conta':'')+') a partir da lista? Isso substitui a escalação atual.')) return;
  escState.preto=[];escState.azul=[];
  if(gks[0]) escToggleTeam(gks[0].id,'preto');
  if(gks[1]) escToggleTeam(gks[1].id,'azul');
  const perTeam=Math.min(ESC_MAX_LINE, Math.floor(line.length/2));
  const jogam=line.slice(0, perTeam*2);
  const grupos={DEF:[],MEI:[],ATA:[]};
  jogam.forEach(function(p){ (grupos[escPos(p)]||grupos.MEI).push(p); });
  Object.keys(grupos).forEach(function(k){ grupos[k].sort(function(a,b){ return escForca(b)-escForca(a) || (a.ordem||999)-(b.ordem||999); }); });
  let np=0,na=0, comeca='preto';
  const escolhidos={preto:[],azul:[]};
  ['DEF','MEI','ATA'].forEach(function(k){
    const g=grupos[k];
    for(let i=0;i<g.length;i++){
      if(np>=perTeam && na>=perTeam) break;
      let t = (i%2===0) ? comeca : (comeca==='preto'?'azul':'preto');
      if(t==='preto' && np>=perTeam) t='azul';
      else if(t==='azul' && na>=perTeam) t='preto';
      if(t==='preto'){ if(np>=perTeam) continue; np++; } else { if(na>=perTeam) continue; na++; }
      escolhidos[t].push(g[i]);
    }
    comeca = (comeca==='preto') ? 'azul' : 'preto';
  });
  // ajuste fino: troca pares da mesma posicao pra aproximar a forca dos times
  const soma=function(arr){return arr.reduce(function(s,p){return s+escForca(p);},0);};
  for(let it=0; it<40; it++){
    let dif=soma(escolhidos.preto)-soma(escolhidos.azul);
    if(Math.abs(dif)<0.05) break;
    let melhor=null;
    escolhidos.preto.forEach(function(a){ escolhidos.azul.forEach(function(b){
      if(escPos(a)!==escPos(b)) return;
      const novo=dif-2*(escForca(a)-escForca(b));
      if(Math.abs(novo)<Math.abs(dif)-1e-9 && (!melhor||Math.abs(novo)<Math.abs(melhor.novo))) melhor={a:a,b:b,novo:novo};
    });});
    if(!melhor) break;
    escolhidos.preto=escolhidos.preto.filter(function(x){return x!==melhor.a;}).concat([melhor.b]);
    escolhidos.azul=escolhidos.azul.filter(function(x){return x!==melhor.b;}).concat([melhor.a]);
  }
  ['preto','azul'].forEach(function(t){
    const ordem={DEF:0,MEI:1,ATA:2};
    escolhidos[t].sort(function(a,b){return ordem[escPos(a)]-ordem[escPos(b)];});
    escolhidos[t].forEach(function(p){ escToggleTeam(p.id,t); });
  });
  for(let k=0;k<isen.length;k++){
    const cp=escCount('preto'), ca=escCount('azul');
    escToggleTeam(isen[k].id, cp.total<=ca.total?'preto':'azul');
  }
  const fora=line.length-jogam.length;
  renderEscBoard();
  const cnt=function(t){const o={DEF:0,MEI:0,ATA:0};escState[t].forEach(function(e){const p=pelById(e.id);if(p&&!escIsGol(p)&&!escIsento(p)){o[escPos(p)]=(o[escPos(p)]||0)+1;}});return o.DEF+'-'+o.MEI+'-'+o.ATA;};
  let msg='Times montados: '+np+'+'+na+' na linha.\nFormação (DEF-MEI-ATA) — Preto '+cnt('preto')+' · Azul '+cnt('azul')+'.';
  const fp=escForcaTime('preto'), fa=escForcaTime('azul');
  msg+='\nAproveitamento somado — Preto '+fp.toFixed(1)+' · Azul '+fa.toFixed(1)+'.';
  if(fora>0) msg+='\n'+fora+' ficaram de fora.';
  alert(msg);
}
function escLimparTudo(){
  if(!escState.editable) return;
  const n=escState.preto.length+escState.azul.length;
  if(!n){ alert('Não tem ninguém escalado.'); return; }
  if(!confirm('Tirar todos os '+n+' jogadores dos dois times?')) return;
  escState.preto=[]; escState.azul=[]; escState.swap=false; escState.swapA=null;
  renderEscBoard();
}
function escSwapMode(){ escState.swap=!escState.swap; escState.swapA=null; renderEscBoard(); }
function escSwapPick(id){
  const teamOf=function(pid){ return escState.preto.some(function(e){return e.id===pid;})?'preto':(escState.azul.some(function(e){return e.id===pid;})?'azul':null); };
  const t=teamOf(id);
  if(!t){ alert('Esse jogador não está escalado.'); return; }
  if(!escState.swapA){ escState.swapA=id; renderEscBoard(); return; }
  if(escState.swapA===id){ escState.swapA=null; renderEscBoard(); return; }
  const a=escState.swapA, b=id, ta=teamOf(a), tb=teamOf(b);
  if(ta===tb){ alert('Escolha um de cada time pra trocar.'); escState.swapA=null; renderEscBoard(); return; }
  const ea=escState[ta].find(function(e){return e.id===a;});
  const eb=escState[tb].find(function(e){return e.id===b;});
  const posA={x:ea.x,y:ea.y}, posB={x:eb.x,y:eb.y};
  escState[ta]=escState[ta].filter(function(e){return e.id!==a;});
  escState[tb]=escState[tb].filter(function(e){return e.id!==b;});
  escState[tb].push({id:a,x:posB.x,y:posB.y,t1:ea.t1});
  escState[ta].push({id:b,x:posA.x,y:posA.y,t1:eb.t1});
  escState.swapA=null; renderEscBoard();
}
function escLimparPresenca(){escState.present=[];escState.halfOnly=[];escState.away=[];escState.showAbsent=false;renderEscBoard();}
// posições de formação (x,y em %); GK embaixo, ataque em cima
const ESC_GK=[50,89];
const ESC_MAX_LINE=8, ESC_MAX_GK=1;
const ESC_ISENTOS=['PERIN'];
const ESC_POS=['DEF','MEI','ATA'];
function escPos(p){
  if(!p) return 'MEI';
  if(escIsGol(p)) return 'GOL';
  const ov=escState.posOv[p.id];
  if(ov) return ov;
  const c=String(p.posicao||'').trim().toUpperCase();
  return ESC_POS.indexOf(c)>=0 ? c : 'MEI';
}
function escCiclaPos(id){
  const p=pelById(id); if(!p||escIsGol(p)) return;
  const atual=escPos(p);
  const i=ESC_POS.indexOf(atual);
  escState.posOv[id]=ESC_POS[(i+1)%ESC_POS.length];
  renderEscBoard();
}
function escForca(p){
  try{
    const ps=(state.seasons[state.season]||{}).players||[];
    const alvo=String(p.nome||'').trim().toUpperCase();
    const s=ps.find(function(x){return String(x.apelido||'').trim().toUpperCase()===alvo;});
    if(!s || !s.jogos) return 0;
    return (s.vitorias*3 + s.empates)/s.jogos;
  }catch(e){ return 0; }
}
function escForcaTime(team){
  return escState[team].reduce(function(s,e){const p=pelById(e.id);return s+(p&&!escIsGol(p)?escForca(p):0);},0);
}
function escIsento(p){return !!p && ESC_ISENTOS.indexOf(String(p.nome||'').trim().toUpperCase())>=0;}
const ESC_SLOTS={DEF:[[18,74],[38,78],[62,78],[82,74],[50,68]],MEI:[[18,52],[38,55],[62,55],[82,52],[50,46]],ATA:[[26,29],[50,22],[74,29],[38,36],[62,36]]};
function escIsGol(p){return !!p && (p.ordem||0)>=100;}
function escCount(team){
  let g=0,l=0,iso=0;
  escState[team].forEach(function(e){ const p=pelById(e.id);
    if(escIsGol(p)) g++;
    else if(escIsento(p)) iso++;
    else l++; });
  return {gk:g, line:l, iso:iso, total:g+l+iso, limite:ESC_MAX_GK+ESC_MAX_LINE+iso};
}
function escNextSlot(team,isGol,pos){
  const taken=escState[team].map(function(e){return e.x+','+e.y;});
  if(isGol && taken.indexOf(ESC_GK[0]+','+ESC_GK[1])<0) return ESC_GK.slice();
  const pref=(pos&&ESC_SLOTS[pos])?pos:'MEI';
  const ordem=[pref].concat(['MEI','DEF','ATA'].filter(function(k){return k!==pref;}));
  for(let k=0;k<ordem.length;k++){ const arr=ESC_SLOTS[ordem[k]]||[];
    for(let i=0;i<arr.length;i++){ const s=arr[i]; if(taken.indexOf(s[0]+','+s[1])<0) return s.slice(); } }
  return [50,50];
}
function escToggleTeam(id,team){
  if(!escState.editable) return;
  const inTeam=escState[team].some(function(e){return e.id===id;});
  escState.preto=escState.preto.filter(function(e){return e.id!==id;});
  escState.azul=escState.azul.filter(function(e){return e.id!==id;});
  if(!inTeam){

function escSetView(v){

async function escMinhasSalvar(){
  if(!sb||!state.user)return;
  const t=document.getElementById('esc-titulo'); if(t)escState.titulo=t.value;
  try{
    const w=escIncompletoMsg(); if(w && !confirm(w)) return;
    const payload={user_id:state.user.id,titulo:escState.titulo||'',preto:escState.preto,azul:escState.azul,meta:{present:escState.present,halfOnly:escState.halfOnly,away:escState.away}};
    let resp;
    if(escState.currentId && escState.currentId!=='new'){
      resp=await sb.from('escalacoes_pessoais').update(payload).eq('id',escState.currentId).select().single();
    } else {
      resp=await sb.from('escalacoes_pessoais').insert(payload).select().single();
    }
    if(resp.error)throw resp.error;
    escState.currentId=resp.data.id;
    const r=await sb.from('escalacoes_pessoais').select('*').order('updated_at',{ascending:false}); escState.myList=r.data||[];
    alert('Escalação salva!');
    renderEscBoard();
  }catch(e){alert('Erro ao salvar: '+(e.message||e));}
}
async function escMinhasExcluir(){
  if(!sb||!state.user||!escState.currentId||escState.currentId==='new')return;
  if(!confirm('Excluir esta escalação?'))return;
  try{
    const del=await sb.from('escalacoes_pessoais').delete().eq('id',escState.currentId);
    if(del.error)throw del.error;
    escState.currentId=null; escState.preto=[]; escState.azul=[]; escState.titulo=''; escState.editable=false;
    const r=await sb.from('escalacoes_pessoais').select('*').order('updated_at',{ascending:false}); escState.myList=r.data||[];
    renderEscBoard();
  }catch(e){alert('Erro ao excluir: '+(e.message||e));}
}
async function escCompartilhar(){
  const el=document.getElementById('esc-pitches')||document.querySelector('.pitches2');
  if(!el){alert('Nada pra compartilhar.');return;}
  if(typeof html2canvas==='undefined'){alert('Biblioteca de imagem não carregou. Tente atualizar a página.');return;}
  try{
    el.classList.add('shotmode');
    let canvas;
    try{ canvas=await html2canvas(el,{backgroundColor:'#0a1424',useCORS:true,scale:2,logging:false,windowWidth:900}); }
    finally{ el.classList.remove('shotmode'); }
    canvas.toBlob(async(blob)=>{
      if(!blob){alert('Falha ao gerar imagem.');return;}
      const file=new File([blob],'escalacao_psot.png',{type:'image/png'});
      const nome=escState.titulo||('Escalação PSOT '+fmtBR(new Date().toISOString().slice(0,10)));
      const texto=nome+' — PSOT';
      if(navigator.canShare && navigator.canShare({files:[file]})){
        try{await navigator.share({files:[file],title:'Escalação PSOT',text:texto});return;}catch(e){if(e.name==='AbortError')return;}
      }
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a'); a.href=url; a.download='escalacao_psot.png'; document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(()=>URL.revokeObjectURL(url),3000);
      window.open('https://wa.me/?text='+encodeURIComponent(texto+' (imagem baixada — anexe manualmente no chat)'),'_blank');
    },'image/png');
  }catch(e){alert('Erro ao gerar imagem: '+(e.message||e));}
}
function escIncompletoMsg(){
  const cp=escCount('preto'), ca=escCount('azul');
  const probs=[];
  if(cp.gk<1) probs.push('Preto sem goleiro');
  if(ca.gk<1) probs.push('Azul sem goleiro');
  if(cp.line!==ca.line) probs.push('times desiguais ('+cp.line+' x '+ca.line+' na linha, sem contar isentos)');
  else if(cp.line<ESC_MAX_LINE) probs.push('só '+cp.line+' por time na linha');
  return probs.length?('Atenção: '+probs.join(' · ')+'.\n\nSalvar mesmo assim?'):null;
}
async function escSalvar(){
  if(!sb||!state.isAdmin)return;
  const w=escIncompletoMsg(); if(w && !confirm(w)) return;
  try{
    const up=await sb.from('escalacoes').upsert({data_jogo:escState.date,preto:escState.preto,azul:escState.azul,meta:{present:escState.present,halfOnly:escState.halfOnly,away:escState.away},updated_at:new Date().toISOString(),updated_by:state.user.email},{onConflict:'data_jogo'});
    if(up.error)throw up.error;
    const r=await sb.from('escalacoes').select('*').order('data_jogo',{ascending:false}); escState.allDates=r.data||[];
    alert('Escalação salva! Todos já conseguem ver.');
    renderEscBoard();
  }catch(e){alert('Erro ao salvar: '+(e.message||e));}
}
function escViewHist(dateISO){const row=escState.allDates.find(d=>d.data_jogo===dateISO);if(!row)return;escState.view='atual';escState.date=dateISO;escState.preto=row.preto||[];escState.azul=row.azul||[];const m=row.meta||{};escState.present=m.present||[];escState.halfOnly=m.halfOnly||[];escState.away=m.away||[];escState.editable=false;renderEscBoard();}
function escNova(){const d=prompt('Data do jogo (AAAA-MM-DD):',nextSaturday());if(!d)return;if(!/^\d{4}-\d{2}-\d{2}$/.test(d)){alert('Formato inválido. Use AAAA-MM-DD.');return;}escState.date=d;escState.preto=[];escState.azul=[];escState.view='atual';escState.editable=!!state.isAdmin;renderEscBoard();}
function escLimpar(team){if(!confirm('Limpar time '+team+'?'))return;escState[team]=[];renderEscBoard();}
function escBindDrag(){
  const root=document.getElementById('esc-root'); if(!root)return;
  root.querySelectorAll('.pbtn[data-assign]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();e.preventDefault();escToggleTeam(b.dataset.pid,b.dataset.assign);}));
  root.querySelectorAll('.tok.editable').forEach(tk=>tk.addEventListener('pointerdown',e=>{if(e.target&&e.target.dataset&&e.target.dataset.rm)return;escStart(e,{kind:'tok',id:tk.dataset.id,team:tk.dataset.team});}));
  root.querySelectorAll('.tok .tx').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();escRemove(b.dataset.rm,b.dataset.team);}));
}
function escStart(e,info){e.preventDefault();escDrag=info;try{if(e.currentTarget&&e.currentTarget.setPointerCapture)e.currentTarget.setPointerCapture(e.pointerId);}catch(_){}const p=pelById(info.id);const gi=document.getElementById('esc-ghost-i');if(gi)gi.innerHTML=pelAv(p);escMove(e);window.addEventListener('pointermove',escMove);window.addEventListener('pointerup',escEnd);}
function escMove(e){const g=document.getElementById('esc-ghost');if(g){g.style.display='flex';g.style.left=e.clientX+'px';g.style.top=e.clientY+'px';}}
function escEnd(e){
  window.removeEventListener('pointermove',escMove);window.removeEventListener('pointerup',escEnd);
  const g=document.getElementById('esc-ghost');if(g)g.style.display='none';
  const d=escDrag;escDrag=null;if(!d)return;
  let tgt=null;
  document.querySelectorAll('.pdrop2').forEach(dp=>{const r=dp.getBoundingClientRect();if(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom)tgt=dp;});
  if(tgt){
    const r=tgt.getBoundingClientRect();const x=Math.max(3,Math.min(97,(e.clientX-r.left)/r.width*100));const y=Math.max(4,Math.min(96,(e.clientY-r.top)/r.height*100));const team=tgt.dataset.team;
    const prevE=escState.preto.find(en=>en.id===d.id)||escState.azul.find(en=>en.id===d.id);
    escState.preto=escState.preto.filter(en=>en.id!==d.id);escState.azul=escState.azul.filter(en=>en.id!==d.id);
    const ne={id:d.id,x:+x.toFixed(1),y:+y.toFixed(1)};
    if((prevE&&prevE.t1)||escState.halfOnly.indexOf(d.id)>=0) ne.t1=true;
    escState[team].push(ne);
    renderEscBoard();
  }else if(d.kind==='tok'){escRemove(d.id,d.team);}
}
function escRemove(id,team){escState[team]=escState[team].filter(en=>en.id!==id);renderEscBoard();}
loadData().catch(e=>{document.getElementById("view").innerHTML=`<div class="empty"><div class="e"><svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4 2.5 20h19z"/><path d="M12 10v4M12 17.4v.01"/></svg></div><p>Erro ao carregar dados.<br><small style="color:var(--txt-3)">${e.message}</small></p></div>`;});
